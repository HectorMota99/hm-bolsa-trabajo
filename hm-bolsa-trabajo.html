<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HM Bolsa de Trabajo – HM Talento Estratégico</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body style="margin:0;padding:0;background:#f4f6fb;">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const IND = "#1A2580";
    const CEL = "#00AEEF";

    // ── PUESTOS por defecto ───────────────────────────────────────────
    const PUESTOS_DEFAULT = [
      { id: "gerente_planta",       nombre: "Gerente de Planta",       area: "Producción",       requisitos: "5+ años manufactura, liderazgo de equipos, NOM-STPS", activo: true },
      { id: "supervisor_produccion",nombre: "Supervisor de Producción",area: "Producción",       requisitos: "3+ años producción, manejo de personal operativo",     activo: true },
      { id: "analista_rh",          nombre: "Analista de RH",          area: "Recursos Humanos", requisitos: "2+ años RH, conocimiento de nómina y LFT",            activo: true },
      { id: "operador_linea",       nombre: "Operador de Línea",       area: "Producción",       requisitos: "1+ año manufactura, disponibilidad de turno",          activo: true },
      { id: "vendedor_ruta",        nombre: "Vendedor de Ruta",        area: "Ventas",            requisitos: "2+ años ventas, licencia de conducir vigente",         activo: true },
      { id: "auxiliar_contable",    nombre: "Auxiliar Contable",       area: "Administración",   requisitos: "Carrera en contabilidad, manejo de Excel",             activo: true },
    ];

    // ── Storage helpers ───────────────────────────────────────────────
    function getCandidatos()  { try { return JSON.parse(localStorage.getItem("hm_candidatos") || "[]"); } catch { return []; } }
    function saveCandidatos(l){ try { localStorage.setItem("hm_candidatos", JSON.stringify(l)); } catch(e){ console.warn(e); } }
    function getPuestos()     { try { return JSON.parse(localStorage.getItem("hm_puestos") || "null") || PUESTOS_DEFAULT; } catch { return PUESTOS_DEFAULT; } }
    function savePuestos(l)   { try { localStorage.setItem("hm_puestos", JSON.stringify(l)); } catch(e){ console.warn(e); } }

    // ── Helpers ───────────────────────────────────────────────────────
    function scoreColor(s) { return s >= 75 ? "#22c55e" : s >= 55 ? "#f59e0b" : "#ef4444"; }
    function scoreLabel(s) { return s >= 75 ? "Alto potencial ✓" : s >= 55 ? "A evaluar" : "No califica"; }
    function formatDate(iso) { if (!iso) return "—"; return new Date(iso).toLocaleDateString("es-MX",{day:"2-digit",month:"short",year:"numeric"}); }

    async function callClaude(systemPrompt, userPrompt, maxTokens = 400) {
      const body = { model:"claude-sonnet-4-20250514", max_tokens:maxTokens, messages:[{role:"user",content:userPrompt}] };
      if (systemPrompt) body.system = systemPrompt;
      const res = await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
      if (!res.ok) throw new Error("API error "+res.status);
      const data = await res.json();
      return data.content[0].text;
    }

    function exportCSV(lista) {
      const headers = ["Nombre","Email","Teléfono","Puesto","Experiencia","Disponibilidad","Pretensión","Score","Estatus","Fecha","CV adjunto"];
      const rows = lista.map(c=>[c.nombre,c.email,c.telefono,c.puesto_nombre,c.anos_experiencia,c.disponibilidad,c.pretension,c.score+"/100",c.estatus,formatDate(c.fecha),c.cvNombre?"Sí":"No"]);
      const csv = [headers,...rows].map(r=>r.map(v=>'"'+String(v||"").replace(/"/g,'""')+'"').join(",")).join("\n");
      const blob = new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8;"});
      const a = document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="candidatos_hm.csv"; a.click();
    }

    function downloadCV(candidato) {
      if (!candidato.cvData || !candidato.cvNombre) return;
      const byteStr = atob(candidato.cvData.split(",")[1]);
      const ab = new ArrayBuffer(byteStr.length);
      const ia = new Uint8Array(ab);
      for (let i=0;i<byteStr.length;i++) ia[i]=byteStr.charCodeAt(i);
      const mime = candidato.cvData.split(";")[0].split(":")[1];
      const blob = new Blob([ab],{type:mime});
      const a = document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=candidato.cvNombre; a.click();
    }

    const SYSTEM_BOT = `Eres el asistente de reclutamiento de HM Talento Estratégico, consultora de RH en Tehuacán, Puebla. Tono profesional, amigable y conciso. Siempre en español. Máximo 2-3 oraciones por respuesta. Haz solo UNA pregunta a la vez.`;

    // ── ESTILOS GLOBALES ──────────────────────────────────────────────
    const GLOBAL_CSS = `
      @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap');
      *{box-sizing:border-box;margin:0;padding:0}
      button{cursor:pointer;font-family:inherit}
      input,select,textarea{font-family:inherit}
      .bpri{background:${IND};color:#fff;border:none;padding:11px 22px;border-radius:10px;font-size:14px;font-weight:600;transition:all .18s}
      .bpri:hover{background:#121c70;transform:translateY(-1px)}
      .bpri:disabled{opacity:.5;cursor:not-allowed;transform:none}
      .bcel{background:${CEL};color:#fff;border:none;padding:9px 18px;border-radius:8px;font-size:13px;font-weight:600;transition:all .18s}
      .bcel:hover{background:#009fd8}
      .bghost{background:transparent;border:1.5px solid ${IND};color:${IND};padding:9px 18px;border-radius:8px;font-size:14px;font-weight:500;transition:all .18s}
      .bghost:hover{background:${IND};color:#fff}
      .card{background:#fff;border-radius:16px;border:1.5px solid #e4e8f0}
      .pulse{animation:pulse 1.8s infinite}
      @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
      .fadein{animation:fi .28s ease}
      @keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
      .tag{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
      ::-webkit-scrollbar{width:5px}
      ::-webkit-scrollbar-thumb{background:#ddd;border-radius:3px}
      .upload-zone{border:2px dashed #d1d5db;border-radius:12px;padding:24px;text-align:center;transition:all .2s;cursor:pointer}
      .upload-zone:hover,.upload-zone.drag{border-color:${CEL};background:#f0faff}
      .tab-btn{padding:8px 16px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
      .tab-active{background:${IND};color:#fff}
      .tab-inactive{background:#f3f4f6;color:#555}
    `;

    // ── APP ───────────────────────────────────────────────────────────
    function App() {
      const [vista, setVista] = useState("home");
      const [puesto, setPuesto] = useState(null);
      const [loginPass, setLoginPass] = useState("");
      const [loginError, setLoginError] = useState("");
      const [puestos, setPuestosState] = useState(getPuestos);

      const recargarPuestos = () => setPuestosState(getPuestos());
      const irCandidato = (p) => { setPuesto(p); setVista("chat"); };
      const intentarLogin = () => {
        if (loginPass === "HMtalento2024") { setLoginError(""); setVista("panel"); }
        else setLoginError("Contraseña incorrecta.");
      };

      return (
        <div style={{fontFamily:"'DM Sans','Segoe UI',sans-serif",minHeight:"100vh",background:"#f4f6fb"}}>
          <style>{GLOBAL_CSS}</style>
          {vista==="home"  && <HomeView puestos={puestos.filter(p=>p.activo)} onCandidato={irCandidato} onLogin={()=>{setLoginError("");setVista("login");}} />}
          {vista==="login" && <LoginView pass={loginPass} setPass={setLoginPass} onLogin={intentarLogin} error={loginError} onBack={()=>setVista("home")} />}
          {vista==="chat"  && <ChatView puesto={puesto} onBack={()=>setVista("home")} />}
          {vista==="panel" && <PanelView onBack={()=>setVista("home")} onPuestosChange={recargarPuestos} />}
        </div>
      );
    }

    // ── HOME ─────────────────────────────────────────────────────────
    function HomeView({ puestos, onCandidato, onLogin }) {
      const areas = {"Producción":["#dbeafe","#1e40af"],"Recursos Humanos":["#fce7f3","#9d174d"],"Ventas":["#dcfce7","#166534"],"Administración":["#fef3c7","#92400e"]};
      return (
        <div>
          <div style={{background:IND,padding:"0 28px"}}>
            <div style={{maxWidth:1080,margin:"0 auto",height:62,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
              <div style={{display:"flex",alignItems:"center",gap:9,color:"#fff"}}>
                <div style={{width:9,height:9,borderRadius:"50%",background:CEL}} />
                <span style={{fontFamily:"'DM Serif Display',serif",fontSize:19}}>HM Talento Estratégico</span>
                <span style={{background:"rgba(0,174,239,.18)",color:CEL,fontSize:10,padding:"2px 8px",borderRadius:20,fontWeight:700}}>BOLSA DE TRABAJO</span>
              </div>
              <button onClick={onLogin} style={{background:"rgba(255,255,255,.1)",border:"1px solid rgba(255,255,255,.25)",color:"#fff",padding:"7px 15px",borderRadius:8,fontSize:13,fontWeight:500}}>
                🔐 Panel reclutador
              </button>
            </div>
          </div>
          <div style={{background:`linear-gradient(135deg,${IND} 0%,#0c175c 100%)`,color:"#fff",padding:"52px 28px 44px",textAlign:"center"}}>
            <div style={{fontFamily:"'DM Serif Display',serif",fontSize:38,lineHeight:1.2,marginBottom:14}}>
              Tu próxima oportunidad<br /><em style={{color:CEL}}>empieza aquí</em>
            </div>
            <p style={{fontSize:16,opacity:.78,maxWidth:480,margin:"0 auto",lineHeight:1.65}}>
              Postúlate en minutos. Nuestro asistente con IA evalúa tu perfil y te conecta con el equipo de reclutamiento.
            </p>
          </div>
          <div style={{maxWidth:1080,margin:"0 auto",padding:"44px 28px"}}>
            <h2 style={{fontSize:24,fontWeight:700,color:"#111",marginBottom:6}}>Vacantes disponibles</h2>
            <p style={{color:"#777",fontSize:14,marginBottom:24}}>{puestos.length} posiciones abiertas · Tehuacán, Puebla y región</p>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(300px,1fr))",gap:18}}>
              {puestos.map(p=>{
                const [bg,fg]=areas[p.area]||["#f3f4f6","#374151"];
                return (
                  <div key={p.id} className="card" style={{padding:22,cursor:"pointer",transition:"all .2s"}}
                    onMouseEnter={e=>{e.currentTarget.style.borderColor=CEL;e.currentTarget.style.transform="translateY(-2px)";e.currentTarget.style.boxShadow="0 6px 24px rgba(0,174,239,.14)";}}
                    onMouseLeave={e=>{e.currentTarget.style.borderColor="#e4e8f0";e.currentTarget.style.transform="none";e.currentTarget.style.boxShadow="none";}}
                    onClick={()=>onCandidato(p)}>
                    <div style={{display:"flex",justifyContent:"space-between",marginBottom:10}}>
                      <span className="tag" style={{background:bg,color:fg}}>{p.area}</span>
                      <span style={{fontSize:11,color:"#aaa"}}>📍 Tehuacán</span>
                    </div>
                    <h3 style={{fontSize:17,fontWeight:700,color:"#111",marginBottom:8,lineHeight:1.3}}>{p.nombre}</h3>
                    <p style={{fontSize:12,color:"#777",lineHeight:1.55,marginBottom:16}}>{p.requisitos}</p>
                    <div style={{textAlign:"right"}}>
                      <button className="bcel" style={{fontSize:12,padding:"7px 14px"}}>Postularme →</button>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    // ── LOGIN ─────────────────────────────────────────────────────────
    function LoginView({ pass, setPass, onLogin, error, onBack }) {
      return (
        <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center"}}>
          <div className="card" style={{width:340,padding:"36px 32px",boxShadow:"0 10px 40px rgba(0,0,0,.1)"}}>
            <div style={{textAlign:"center",marginBottom:24}}>
              <div style={{width:52,height:52,borderRadius:"50%",background:IND,display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 14px",fontSize:22}}>🔐</div>
              <h2 style={{fontSize:20,fontWeight:700,color:"#111"}}>Panel Reclutador</h2>
              <p style={{color:"#888",fontSize:13,marginTop:4}}>HM Talento Estratégico</p>
            </div>
            <input value={pass} onChange={e=>setPass(e.target.value)} type="password" placeholder="Contraseña de acceso"
              onKeyDown={e=>e.key==="Enter"&&onLogin()}
              style={{width:"100%",padding:"11px 14px",border:"1.5px solid #e5e7eb",borderRadius:10,fontSize:14,marginBottom:error?8:16,outline:"none"}} />
            {error && <p style={{color:"#ef4444",fontSize:12,marginBottom:14}}>{error}</p>}
            <button className="bpri" style={{width:"100%",marginBottom:10}} onClick={onLogin}>Ingresar</button>
            <button onClick={onBack} className="bghost" style={{width:"100%",fontSize:13}}>← Volver</button>
          </div>
        </div>
      );
    }

    // ── CHAT BOT ──────────────────────────────────────────────────────
    function UploadWidget({ onEnviar }) {
      const [cvFile, setCvFile] = useState(null);
      const [drag, setDrag]     = useState(false);
      const [enviando, setEnviando] = useState(false);
      const fileRef = useRef(null);

      function handleFile(file) {
        if (!file) return;
        const allowed = ["application/pdf","application/msword","application/vnd.openxmlformats-officedocument.wordprocessingml.document"];
        if (!allowed.includes(file.type)) { alert("Solo se permiten archivos PDF o Word (.doc, .docx)"); return; }
        if (file.size > 5*1024*1024) { alert("El archivo no debe superar 5 MB"); return; }
        setCvFile(file);
      }

      async function submit(omitir) {
        setEnviando(true);
        let cvData = null, cvNombre = null;
        if (!omitir && cvFile) {
          const r = new FileReader();
          cvData = await new Promise((res,rej)=>{ r.onload=e=>res(e.target.result); r.onerror=rej; r.readAsDataURL(cvFile); });
          cvNombre = cvFile.name;
        }
        onEnviar(cvData, cvNombre);
      }

      return (
        <div className="fadein" style={{display:"flex",alignItems:"flex-start",gap:8,maxWidth:"92%"}}>
          <div style={{width:30,height:30,borderRadius:"50%",background:IND,display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,flexShrink:0,marginTop:2}}>🤖</div>
          <div style={{flex:1,background:"#fff",border:"1.5px solid #e4e8f0",borderRadius:"18px 18px 18px 4px",padding:"16px 18px",boxShadow:"0 2px 8px rgba(0,0,0,.06)"}}>
            <p style={{fontSize:14,color:"#1a1a2e",lineHeight:1.6,marginBottom:14}}>
              📋 Para darte un seguimiento oportuno, necesitamos que adjuntes tu <strong>CV o carta de presentación</strong> en formato <strong>PDF o Word</strong>. Este documento nos permite agilizar tu proceso de selección. 👇
            </p>

            {/* Zona drag & drop */}
            <div
              className={`upload-zone ${drag?"drag":""}`}
              style={{marginBottom:12,background:cvFile?"#f0fff4":drag?"#f0faff":"#fafafa"}}
              onDragOver={e=>{e.preventDefault();setDrag(true);}}
              onDragLeave={()=>setDrag(false)}
              onDrop={e=>{e.preventDefault();setDrag(false);handleFile(e.dataTransfer.files[0]);}}
              onClick={()=>!enviando&&fileRef.current?.click()}>
              <input ref={fileRef} type="file" accept=".pdf,.doc,.docx" style={{display:"none"}} onChange={e=>handleFile(e.target.files[0])} />
              {cvFile ? (
                <div>
                  <div style={{fontSize:28,marginBottom:6}}>✅</div>
                  <div style={{fontWeight:700,color:"#166534",fontSize:14}}>{cvFile.name}</div>
                  <div style={{fontSize:12,color:"#888",marginTop:3}}>{(cvFile.size/1024).toFixed(0)} KB · Toca para cambiar el archivo</div>
                </div>
              ) : (
                <div>
                  <div style={{fontSize:32,marginBottom:8}}>📎</div>
                  <div style={{fontWeight:600,color:"#555",fontSize:14,marginBottom:4}}>Arrastra tu CV aquí</div>
                  <div style={{fontSize:12,color:"#999"}}>PDF · Word (.doc / .docx) · Máx. 5 MB</div>
                  <div style={{marginTop:10,display:"inline-block",padding:"7px 18px",background:CEL,color:"#fff",borderRadius:8,fontSize:13,fontWeight:600}}>Seleccionar archivo</div>
                </div>
              )}
            </div>

            {/* Botones acción */}
            <div style={{display:"flex",gap:8}}>
              <button onClick={()=>submit(false)} disabled={!cvFile||enviando} className="bpri" style={{flex:2,fontSize:13,padding:"10px 14px",opacity:(!cvFile||enviando)?.5:1}}>
                {enviando?"Enviando...":"📤 Enviar CV y finalizar"}
              </button>
              <button onClick={()=>submit(true)} disabled={enviando} style={{flex:1,fontSize:12,padding:"10px 14px",border:"1.5px solid #d1d5db",borderRadius:10,background:"transparent",color:"#888",fontWeight:500,cursor:"pointer"}}>
                Omitir
              </button>
            </div>
            <p style={{fontSize:11,color:"#bbb",marginTop:8,textAlign:"center"}}>Tu información se maneja de forma confidencial</p>
          </div>
        </div>
      );
    }

    function ChatView({ puesto, onBack }) {
      const [msgs, setMsgs]   = useState([]);
      const [input, setInput] = useState("");
      const [loading, setLoading] = useState(false);
      const [etapa, setEtapa] = useState("nombre");
      const [datos, setDatos] = useState({puesto_id:puesto.id,puesto_nombre:puesto.nombre});
      const [done, setDone]   = useState(false);
      const [scoreInfo, setScoreInfo] = useState(null);
      const [esperandoCV, setEsperandoCV] = useState(false);
      const bottomRef = useRef(null);

      useEffect(()=>{
        addBot(`¡Hola! 👋 Soy el asistente de selección de **HM Talento Estratégico**.\n\nQuiero conocerte para la posición de **${puesto.nombre}** (${puesto.area}).\n\nEl proceso toma solo 5 minutos. Comencemos: ¿cuál es tu **nombre completo**?`);
      },[]);
      useEffect(()=>{ bottomRef.current?.scrollIntoView({behavior:"smooth"}); },[msgs,loading,esperandoCV]);

      const addBot  = (t) => setMsgs(p=>[...p,{tipo:"bot",texto:t}]);
      const addUser = (t) => setMsgs(p=>[...p,{tipo:"user",texto:t}]);

      async function enviar() {
        const val = input.trim();
        if (!val||loading||done||esperandoCV) return;
        setInput(""); addUser(val); setLoading(true);
        try { await procesar(val); } catch(err){ console.error(err); addBot("⚠️ Ocurrió un problema al conectar. Por favor intenta de nuevo."); }
        setLoading(false);
      }

      async function recibirCV(cvData, cvNombre) {
        setEsperandoCV(false);
        if (cvNombre) {
          setMsgs(p=>[...p,{tipo:"user",texto:`📎 ${cvNombre}`}]);
        } else {
          setMsgs(p=>[...p,{tipo:"user",texto:"Prefiero omitir el CV por ahora"}]);
        }
        setLoading(true);
        try {
          await guardarCandidato(datos, cvData, cvNombre);
        } catch(e) {
          console.error(e);
          if (window.location.protocol === "file:") {
            addBot("⚠️ Modo local detectado. La API de Claude no funciona al abrir el archivo desde tu computadora directamente.

Sube el archivo a GitHub → Vercel y pruébalo desde tu URL pública. Ahí funcionará correctamente. ✅");
          } else {
            addBot("⚠️ Error de conexión. Intenta de nuevo en unos segundos.");
            setEsperandoCV(true);
          }
        }
        setLoading(false);
      }

      async function guardarCandidato(d, cvData, cvNombre) {
        const evalPrompt = `Evalúa este candidato para ${d.puesto_nombre} en HM Talento Estratégico.\n\nCANDIDATO:\n- Nombre: ${d.nombre}\n- Experiencia: ${d.anos_experiencia} años\n- Logros: ${d.logros}\n- Disponibilidad: ${d.disponibilidad}\n- Pretensión salarial: ${d.pretension}\n- CV adjunto: ${cvNombre?"Sí ("+cvNombre+")":"No"}\n\nREQUISITOS DEL PUESTO: ${puesto.requisitos}\n\nINSTRUCCIONES:\n1. Escribe un mensaje de cierre cálido y profesional (2-3 párrafos) agradeciendo al candidato. Dile que el equipo revisará su perfil en 2-3 días hábiles y lo contactarán por WhatsApp o correo si avanza.\n2. En la ÚLTIMA línea escribe exactamente: SCORE:XX`;
        const evalResp = await callClaude(SYSTEM_BOT, evalPrompt, 600);
        const match = evalResp.match(/SCORE:(\d+)/);
        const score = match ? Math.min(100,Math.max(0,parseInt(match[1]))) : 60;
        const mensajeCierre = evalResp.replace(/SCORE:\d+/g,"").trim();
        const candidato = {
          ...d, score, id: Date.now().toString(),
          fecha: new Date().toISOString(),
          estatus: score>=75?"Preseleccionado":score>=55?"En revisión":"Descartado",
          cvData, cvNombre,
        };
        const lista = getCandidatos(); lista.push(candidato); saveCandidatos(lista);
        addBot(mensajeCierre);
        setScoreInfo({score,label:scoreLabel(score),color:scoreColor(score)});
        setDone(true);
      }

      async function procesar(val) {
        const d = {...datos};
        if (etapa==="nombre")             { d.nombre=val; setDatos(d); setEtapa("email"); addBot(`Mucho gusto, **${val}**. 😊 ¿Cuál es tu **correo electrónico**?`); }
        else if (etapa==="email")         { d.email=val; setDatos(d); setEtapa("telefono"); addBot("Perfecto. ¿Y tu número de **teléfono o WhatsApp**?"); }
        else if (etapa==="telefono")      { d.telefono=val; setDatos(d); setEtapa("experiencia"); addBot(`Gracias. ¿Cuántos **años de experiencia** tienes en el área de ${puesto.area}?`); }
        else if (etapa==="experiencia")   { d.anos_experiencia=val; setDatos(d); setEtapa("logros");
          const resp = await callClaude(SYSTEM_BOT,`Candidato: ${d.nombre}, aplica a ${puesto.nombre}. Tiene ${val} años de experiencia en ${puesto.area}. Pídele en 2 oraciones que describa brevemente sus logros más relevantes relacionados con: ${puesto.requisitos}.`);
          addBot(resp);
        }
        else if (etapa==="logros")        { d.logros=val; setDatos(d); setEtapa("disponibilidad"); addBot("Muy bien. ¿Tienes **disponibilidad inmediata**? ¿Y en qué turno puedes trabajar?"); }
        else if (etapa==="disponibilidad"){ d.disponibilidad=val; setDatos(d); setEtapa("pretension"); addBot("Casi terminamos. ¿Cuál es tu **pretensión salarial mensual** (neto)?"); }
        else if (etapa==="pretension")    { d.pretension=val; setDatos(d); setEtapa("cv"); setEsperandoCV(true); }
      }

      function renderTexto(txt) {
        return txt.split(/(\*\*[^*]+\*\*)/).map((p,i)=>p.startsWith("**")?<strong key={i}>{p.replace(/\*\*/g,"")}</strong>:p);
      }

      return (
        <div style={{minHeight:"100vh",display:"flex",flexDirection:"column",background:"#f4f6fb"}}>
          {/* Header */}
          <div style={{background:IND,color:"#fff",padding:"0 20px",height:60,display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0}}>
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              <button onClick={onBack} style={{background:"none",border:"none",color:"#fff",fontSize:18,opacity:.7}}>←</button>
              <div>
                <div style={{fontWeight:600,fontSize:15}}>{puesto.nombre}</div>
                <div style={{fontSize:11,opacity:.65}}>{puesto.area} · Asistente IA</div>
              </div>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:6}}>
              <div style={{width:8,height:8,borderRadius:"50%",background:"#22c55e"}} className="pulse" />
              <span style={{fontSize:12,opacity:.75}}>En línea</span>
            </div>
          </div>

          {/* Mensajes */}
          <div style={{flex:1,overflowY:"auto",padding:"20px 16px",display:"flex",flexDirection:"column",gap:10}}>
            {msgs.map((m,i)=>(
              <div key={i} className="fadein" style={{display:"flex",justifyContent:m.tipo==="user"?"flex-end":"flex-start",alignItems:"flex-end",gap:8}}>
                {m.tipo==="bot"&&<div style={{width:30,height:30,borderRadius:"50%",background:IND,display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,flexShrink:0}}>🤖</div>}
                <div style={{maxWidth:"76%",padding:"11px 15px",borderRadius:m.tipo==="user"?"18px 18px 4px 18px":"18px 18px 18px 4px",background:m.tipo==="user"?IND:"#fff",color:m.tipo==="user"?"#fff":"#1a1a2e",fontSize:14,lineHeight:1.65,boxShadow:"0 2px 8px rgba(0,0,0,.06)",border:m.tipo==="bot"?"1px solid #e4e8f0":"none",whiteSpace:"pre-wrap"}}>
                  {renderTexto(m.texto)}
                </div>
              </div>
            ))}

            {/* Widget de carga de CV — aparece como burbuja del bot */}
            {esperandoCV && <UploadWidget onEnviar={recibirCV} />}

            {loading&&(
              <div style={{display:"flex",alignItems:"flex-end",gap:8}}>
                <div style={{width:30,height:30,borderRadius:"50%",background:IND,display:"flex",alignItems:"center",justifyContent:"center",fontSize:13}}>🤖</div>
                <div style={{background:"#fff",border:"1px solid #e4e8f0",borderRadius:"18px 18px 18px 4px",padding:"14px 18px",display:"flex",gap:5,alignItems:"center"}}>
                  {[0,1,2].map(i=><div key={i} className="pulse" style={{width:7,height:7,borderRadius:"50%",background:CEL,animationDelay:`${i*0.2}s`}} />)}
                </div>
              </div>
            )}

            {scoreInfo&&(
              <div className="fadein" style={{background:"#fff",border:`2px solid ${scoreInfo.color}`,borderRadius:14,padding:"16px 20px",textAlign:"center",margin:"8px 0"}}>
                <div style={{fontSize:13,color:"#888",marginBottom:6}}>Tu compatibilidad con el puesto</div>
                <div style={{fontSize:36,fontWeight:800,color:scoreInfo.color}}>{scoreInfo.score}<span style={{fontSize:18}}>/100</span></div>
                <div style={{fontSize:14,fontWeight:600,color:scoreInfo.color,marginTop:4}}>{scoreInfo.label}</div>
              </div>
            )}
            <div ref={bottomRef} />
          </div>

          {/* Input — oculto mientras espera CV */}
          <div style={{background:"#fff",borderTop:"1px solid #e4e8f0",padding:"14px 16px",display:"flex",gap:10,flexShrink:0}}>
            {done?(
              <button onClick={onBack} className="bghost" style={{width:"100%"}}>← Volver a vacantes</button>
            ):esperandoCV?(
              <div style={{width:"100%",textAlign:"center",fontSize:13,color:"#bbb",padding:"4px 0"}}>Adjunta tu CV usando el widget de arriba</div>
            ):(
              <>
                <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&!e.shiftKey&&enviar()} placeholder="Escribe tu respuesta..." disabled={loading} style={{flex:1,padding:"11px 15px",border:"1.5px solid #e5e7eb",borderRadius:12,fontSize:14,outline:"none",background:loading?"#f9f9f9":"#fff"}} />
                <button onClick={enviar} disabled={loading||!input.trim()} className="bpri" style={{padding:"11px 18px"}}>→</button>
              </>
            )}
          </div>
        </div>
      );
    }

    // ── PANEL RECLUTADOR ──────────────────────────────────────────────
    function PanelView({ onBack, onPuestosChange }) {
      const [tab, setTab] = useState("candidatos");
      return (
        <div style={{minHeight:"100vh",background:"#f4f6fb"}}>
          <div style={{background:IND,color:"#fff",padding:"0 24px",height:64,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
            <div style={{display:"flex",alignItems:"center",gap:12}}>
              <button onClick={onBack} style={{background:"none",border:"none",color:"#fff",fontSize:18,opacity:.7}}>←</button>
              <span style={{fontFamily:"'DM Serif Display',serif",fontSize:20}}>Panel de Reclutamiento</span>
            </div>
            <div style={{display:"flex",gap:8}}>
              <button onClick={()=>setTab("candidatos")} className={`tab-btn ${tab==="candidatos"?"tab-active":"tab-inactive"}`}>👥 Candidatos</button>
              <button onClick={()=>setTab("vacantes")} className={`tab-btn ${tab==="vacantes"?"tab-active":"tab-inactive"}`}>📋 Vacantes</button>
            </div>
          </div>
          {tab==="candidatos" && <CandidatosTab />}
          {tab==="vacantes"   && <VacantesTab onPuestosChange={onPuestosChange} />}
        </div>
      );
    }

    // ── TAB: CANDIDATOS ───────────────────────────────────────────────
    function CandidatosTab() {
      const [candidatos, setCandidatos] = useState([]);
      const [cargando, setCargando] = useState(true);
      const [filtro, setFiltro] = useState("todos");
      const [busqueda, setBusqueda] = useState("");
      const [sel, setSel] = useState(null);

      useEffect(()=>{ const l=getCandidatos(); setCandidatos(l.sort((a,b)=>b.score-a.score)); setCargando(false); },[]);

      function cambiarEstatus(id, estatus) {
        const updated = candidatos.map(c=>c.id===id?{...c,estatus}:c);
        setCandidatos(updated); setSel(prev=>prev?{...prev,estatus}:null); saveCandidatos(updated);
      }
      function eliminar(id) {
        const updated = candidatos.filter(c=>c.id!==id);
        setCandidatos(updated); setSel(null); saveCandidatos(updated);
      }

      const filtrados = candidatos.filter(c=>{
        const okFiltro = filtro==="todos"||c.estatus===filtro;
        const q = busqueda.toLowerCase();
        const okBusqueda = !busqueda||(c.nombre||"").toLowerCase().includes(q)||(c.puesto_nombre||"").toLowerCase().includes(q);
        return okFiltro&&okBusqueda;
      });

      const stats = {
        total:candidatos.length,
        pre:candidatos.filter(c=>c.estatus==="Preseleccionado").length,
        rev:candidatos.filter(c=>c.estatus==="En revisión").length,
        des:candidatos.filter(c=>c.estatus==="Descartado").length,
        prom:candidatos.length?Math.round(candidatos.reduce((a,c)=>a+(c.score||0),0)/candidatos.length):0,
      };

      return (
        <div style={{maxWidth:1200,margin:"0 auto",padding:24}}>
          {/* Stats */}
          <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:14,marginBottom:24}}>
            {[
              {label:"Total",valor:stats.total,color:IND},
              {label:"Preseleccionados",valor:stats.pre,color:"#22c55e"},
              {label:"En revisión",valor:stats.rev,color:"#f59e0b"},
              {label:"Descartados",valor:stats.des,color:"#ef4444"},
              {label:"Score promedio",valor:stats.prom+"/100",color:CEL},
            ].map((s,i)=>(
              <div key={i} className="card" style={{padding:"16px 18px"}}>
                <div style={{fontSize:26,fontWeight:800,color:s.color}}>{s.valor}</div>
                <div style={{fontSize:12,color:"#888",marginTop:3}}>{s.label}</div>
              </div>
            ))}
          </div>

          <div style={{display:"grid",gridTemplateColumns:sel?"1fr 380px":"1fr",gap:20}}>
            <div>
              <div className="card" style={{padding:"14px 18px",marginBottom:14,display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
                <input value={busqueda} onChange={e=>setBusqueda(e.target.value)} placeholder="🔍 Buscar por nombre o puesto..."
                  style={{flex:1,minWidth:180,padding:"8px 12px",border:"1.5px solid #e5e7eb",borderRadius:8,fontSize:14,outline:"none"}} />
                <button onClick={()=>exportCSV(candidatos)} className="bcel" style={{fontSize:12}}>⬇ Exportar Excel</button>
                {["todos","Preseleccionado","En revisión","Descartado"].map(f=>(
                  <button key={f} onClick={()=>setFiltro(f)} style={{padding:"8px 14px",borderRadius:8,fontSize:12,fontWeight:600,border:"none",background:filtro===f?IND:"#f3f4f6",color:filtro===f?"#fff":"#555"}}>
                    {f==="todos"?"Todos":f}
                  </button>
                ))}
              </div>

              <div className="card" style={{overflow:"hidden"}}>
                {cargando?(
                  <div style={{padding:40,textAlign:"center",color:"#888"}}>Cargando candidatos...</div>
                ):filtrados.length===0?(
                  <div style={{padding:40,textAlign:"center",color:"#888"}}>
                    {candidatos.length===0?"Aún no hay candidatos.":"Ningún candidato coincide con el filtro."}
                  </div>
                ):(
                  <>
                    <div style={{display:"grid",gridTemplateColumns:"2fr 1.5fr 80px 120px 80px 80px",padding:"10px 18px",background:"#f8f9fb",borderBottom:"1px solid #e8eaf0",fontSize:11,fontWeight:700,color:"#999",textTransform:"uppercase",letterSpacing:.4}}>
                      <span>Candidato</span><span>Puesto</span><span>Score</span><span>Estatus</span><span>CV</span><span>Fecha</span>
                    </div>
                    {filtrados.map(c=>{
                      const ec={"Preseleccionado":["#dcfce7","#166534"],"En revisión":["#fef3c7","#92400e"],"Descartado":["#fee2e2","#991b1b"],"Contratado":["#dbeafe","#1e40af"]};
                      const [ebg,efg]=ec[c.estatus]||["#f3f4f6","#555"];
                      return (
                        <div key={c.id} onClick={()=>setSel(c)}
                          style={{display:"grid",gridTemplateColumns:"2fr 1.5fr 80px 120px 80px 80px",padding:"13px 18px",borderBottom:"1px solid #f0f0f5",cursor:"pointer",transition:"background .12s",background:sel?.id===c.id?"#f0f5ff":"transparent"}}
                          onMouseEnter={e=>{if(sel?.id!==c.id)e.currentTarget.style.background="#fafafa";}}
                          onMouseLeave={e=>{if(sel?.id!==c.id)e.currentTarget.style.background="transparent";}}>
                          <div><div style={{fontWeight:600,fontSize:14,color:"#111"}}>{c.nombre||"—"}</div><div style={{fontSize:12,color:"#888"}}>{c.email}</div></div>
                          <div style={{fontSize:13,color:"#555",display:"flex",alignItems:"center"}}>{c.puesto_nombre}</div>
                          <div style={{display:"flex",alignItems:"center"}}><div style={{width:38,height:38,borderRadius:"50%",background:scoreColor(c.score)+"20",display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:800,color:scoreColor(c.score)}}>{c.score}</div></div>
                          <div style={{display:"flex",alignItems:"center"}}><span className="tag" style={{background:ebg,color:efg,fontSize:11}}>{c.estatus}</span></div>
                          <div style={{display:"flex",alignItems:"center",fontSize:18}}>{c.cvNombre?"📎":"—"}</div>
                          <div style={{fontSize:12,color:"#999",display:"flex",alignItems:"center"}}>{formatDate(c.fecha)}</div>
                        </div>
                      );
                    })}
                  </>
                )}
              </div>
            </div>

            {/* Detalle candidato */}
            {sel&&(
              <div className="card" style={{height:"fit-content",overflow:"hidden",position:"sticky",top:24}}>
                <div style={{background:IND,padding:"20px 22px",color:"#fff"}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                    <div><div style={{fontSize:17,fontWeight:700}}>{sel.nombre}</div><div style={{fontSize:12,opacity:.7,marginTop:2}}>{sel.puesto_nombre}</div></div>
                    <button onClick={()=>setSel(null)} style={{background:"none",border:"none",color:"#fff",fontSize:18,opacity:.6}}>✕</button>
                  </div>
                  <div style={{marginTop:14,display:"flex",alignItems:"center",gap:12}}>
                    <div style={{width:52,height:52,borderRadius:"50%",background:scoreColor(sel.score),display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,fontWeight:800,color:"#fff"}}>{sel.score}</div>
                    <div><div style={{fontSize:13,fontWeight:600}}>{scoreLabel(sel.score)}</div><div style={{fontSize:11,opacity:.7}}>Score de compatibilidad / 100</div></div>
                  </div>
                </div>
                <div style={{padding:"18px 22px"}}>
                  {[["Email",sel.email],["Teléfono",sel.telefono],["Años de experiencia",sel.anos_experiencia],["Disponibilidad",sel.disponibilidad],["Pretensión salarial",sel.pretension]].map(([label,valor],i)=>(
                    <div key={i} style={{marginBottom:12}}>
                      <div style={{fontSize:10,fontWeight:700,color:"#aaa",textTransform:"uppercase",letterSpacing:.5,marginBottom:2}}>{label}</div>
                      <div style={{fontSize:14,color:"#111"}}>{valor||"—"}</div>
                    </div>
                  ))}
                  {sel.logros&&(
                    <div style={{marginBottom:14}}>
                      <div style={{fontSize:10,fontWeight:700,color:"#aaa",textTransform:"uppercase",letterSpacing:.5,marginBottom:6}}>Experiencia y logros</div>
                      <div style={{fontSize:13,color:"#444",lineHeight:1.6,background:"#f8f9fb",padding:"10px 12px",borderRadius:8}}>{sel.logros}</div>
                    </div>
                  )}

                  {/* CV */}
                  {sel.cvNombre&&(
                    <div style={{marginBottom:14,background:"#f0f5ff",borderRadius:10,padding:"12px 14px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                      <div style={{display:"flex",alignItems:"center",gap:8}}>
                        <span style={{fontSize:20}}>📎</span>
                        <div><div style={{fontSize:13,fontWeight:600,color:IND}}>{sel.cvNombre}</div><div style={{fontSize:11,color:"#888"}}>Currículum adjunto</div></div>
                      </div>
                      <button onClick={()=>downloadCV(sel)} className="bcel" style={{fontSize:12,padding:"6px 12px"}}>⬇ Descargar</button>
                    </div>
                  )}

                  <div style={{borderTop:"1px solid #f0f0f5",paddingTop:14,marginTop:4}}>
                    <div style={{fontSize:11,fontWeight:700,color:"#888",marginBottom:8}}>CAMBIAR ESTATUS</div>
                    <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:14}}>
                      {["Preseleccionado","En revisión","Descartado","Contratado"].map(e=>(
                        <button key={e} onClick={()=>cambiarEstatus(sel.id,e)}
                          style={{padding:"6px 11px",borderRadius:8,fontSize:11,fontWeight:700,border:"none",background:sel.estatus===e?IND:"#f3f4f6",color:sel.estatus===e?"#fff":"#555",transition:"all .15s"}}>
                          {e}
                        </button>
                      ))}
                    </div>
                    <button onClick={()=>eliminar(sel.id)} style={{width:"100%",padding:"9px",borderRadius:8,fontSize:13,border:"1.5px solid #fee2e2",background:"transparent",color:"#ef4444",fontWeight:600}}>
                      🗑 Eliminar candidato
                    </button>
                  </div>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ── TAB: VACANTES ─────────────────────────────────────────────────
    function VacantesTab({ onPuestosChange }) {
      const [puestos, setPuestos] = useState(getPuestos);
      const [editando, setEditando] = useState(null); // puesto en edición
      const [form, setForm] = useState({});
      const [nuevo, setNuevo] = useState(false);

      const AREAS = ["Producción","Recursos Humanos","Ventas","Administración","Logística","TI","Dirección"];

      function guardar() {
        let lista;
        if (nuevo) {
          const np = {...form, id: "p_"+Date.now(), activo: true};
          lista = [...puestos, np];
        } else {
          lista = puestos.map(p=>p.id===editando?{...p,...form}:p);
        }
        savePuestos(lista); setPuestos(lista); setEditando(null); setNuevo(false); onPuestosChange();
      }

      function toggleActivo(id) {
        const lista = puestos.map(p=>p.id===id?{...p,activo:!p.activo}:p);
        savePuestos(lista); setPuestos(lista); onPuestosChange();
      }

      function eliminarPuesto(id) {
        if (!confirm("¿Eliminar esta vacante?")) return;
        const lista = puestos.filter(p=>p.id!==id);
        savePuestos(lista); setPuestos(lista); onPuestosChange();
      }

      function abrirEditar(p) {
        setForm({nombre:p.nombre,area:p.area,requisitos:p.requisitos});
        setEditando(p.id); setNuevo(false);
      }

      function abrirNuevo() {
        setForm({nombre:"",area:"Producción",requisitos:""}); setNuevo(true); setEditando(null);
      }

      const areaColors = {"Producción":["#dbeafe","#1e40af"],"Recursos Humanos":["#fce7f3","#9d174d"],"Ventas":["#dcfce7","#166534"],"Administración":["#fef3c7","#92400e"],"Logística":["#ede9fe","#6d28d9"],"TI":["#ecfdf5","#065f46"],"Dirección":["#fff1f2","#9f1239"]};

      return (
        <div style={{maxWidth:1000,margin:"0 auto",padding:24}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
            <div>
              <h2 style={{fontSize:20,fontWeight:700,color:"#111"}}>Gestión de Vacantes</h2>
              <p style={{fontSize:13,color:"#888",marginTop:2}}>{puestos.filter(p=>p.activo).length} activas · {puestos.filter(p=>!p.activo).length} inactivas</p>
            </div>
            <button onClick={abrirNuevo} className="bpri" style={{display:"flex",alignItems:"center",gap:6}}>+ Nueva vacante</button>
          </div>

          {/* Modal editar / nuevo */}
          {(editando||nuevo)&&(
            <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.45)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:999}}>
              <div className="card" style={{width:520,padding:"28px 32px",boxShadow:"0 20px 60px rgba(0,0,0,.2)"}}>
                <h3 style={{fontSize:18,fontWeight:700,color:"#111",marginBottom:20}}>{nuevo?"Nueva vacante":"Editar vacante"}</h3>
                <div style={{marginBottom:14}}>
                  <label style={{fontSize:12,fontWeight:700,color:"#888",textTransform:"uppercase",letterSpacing:.5,display:"block",marginBottom:6}}>Nombre del puesto</label>
                  <input value={form.nombre||""} onChange={e=>setForm(f=>({...f,nombre:e.target.value}))}
                    style={{width:"100%",padding:"10px 14px",border:"1.5px solid #e5e7eb",borderRadius:10,fontSize:14,outline:"none"}} />
                </div>
                <div style={{marginBottom:14}}>
                  <label style={{fontSize:12,fontWeight:700,color:"#888",textTransform:"uppercase",letterSpacing:.5,display:"block",marginBottom:6}}>Área</label>
                  <select value={form.area||"Producción"} onChange={e=>setForm(f=>({...f,area:e.target.value}))}
                    style={{width:"100%",padding:"10px 14px",border:"1.5px solid #e5e7eb",borderRadius:10,fontSize:14,outline:"none",background:"#fff"}}>
                    {AREAS.map(a=><option key={a}>{a}</option>)}
                  </select>
                </div>
                <div style={{marginBottom:20}}>
                  <label style={{fontSize:12,fontWeight:700,color:"#888",textTransform:"uppercase",letterSpacing:.5,display:"block",marginBottom:6}}>Requisitos (el bot los usa para evaluar candidatos)</label>
                  <textarea value={form.requisitos||""} onChange={e=>setForm(f=>({...f,requisitos:e.target.value}))} rows={3}
                    style={{width:"100%",padding:"10px 14px",border:"1.5px solid #e5e7eb",borderRadius:10,fontSize:14,outline:"none",resize:"vertical"}} />
                </div>
                <div style={{display:"flex",gap:10}}>
                  <button onClick={guardar} className="bpri" style={{flex:1}} disabled={!form.nombre||!form.requisitos}>Guardar vacante</button>
                  <button onClick={()=>{setEditando(null);setNuevo(false);}} className="bghost" style={{flex:1}}>Cancelar</button>
                </div>
              </div>
            </div>
          )}

          {/* Lista de vacantes */}
          <div style={{display:"flex",flexDirection:"column",gap:12}}>
            {puestos.map(p=>{
              const [bg,fg]=areaColors[p.area]||["#f3f4f6","#555"];
              return (
                <div key={p.id} className="card" style={{padding:"18px 22px",opacity:p.activo?1:.55,transition:"opacity .2s"}}>
                  <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:12}}>
                    <div style={{flex:1}}>
                      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:6}}>
                        <span className="tag" style={{background:bg,color:fg}}>{p.area}</span>
                        <span style={{fontSize:12,fontWeight:600,color:p.activo?"#22c55e":"#aaa"}}>{p.activo?"● Activa":"○ Inactiva"}</span>
                      </div>
                      <h3 style={{fontSize:16,fontWeight:700,color:"#111",marginBottom:4}}>{p.nombre}</h3>
                      <p style={{fontSize:12,color:"#777",lineHeight:1.5}}>{p.requisitos}</p>
                    </div>
                    <div style={{display:"flex",gap:8,flexShrink:0}}>
                      <button onClick={()=>abrirEditar(p)} style={{padding:"8px 14px",borderRadius:8,fontSize:12,fontWeight:600,border:`1.5px solid ${IND}`,background:"transparent",color:IND}}>✏️ Editar</button>
                      <button onClick={()=>toggleActivo(p.id)} style={{padding:"8px 14px",borderRadius:8,fontSize:12,fontWeight:600,border:"1.5px solid #e5e7eb",background:p.activo?"#fff7ed":"#f0fff4",color:p.activo?"#f59e0b":"#22c55e"}}>
                        {p.activo?"Desactivar":"Activar"}
                      </button>
                      <button onClick={()=>eliminarPuesto(p.id)} style={{padding:"8px 12px",borderRadius:8,fontSize:12,fontWeight:600,border:"1.5px solid #fee2e2",background:"transparent",color:"#ef4444"}}>🗑</button>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // ── RENDER ────────────────────────────────────────────────────────
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
