const _memStore={};
function _getStore(k){try{const v=localStorage.getItem(k);if(v!==null)return v;}catch(e){}try{const v=sessionStorage.getItem(k);if(v!==null)return v;}catch(e){}return _memStore[k]||null;}
function _setStore(k,v){try{localStorage.setItem(k,v);}catch(e){}try{sessionStorage.setItem(k,v);}catch(e){}_memStore[k]=v;}
function _localGet(){try{return JSON.parse(_getStore("hm_candidatos")||"[]")}catch{return[]}}

// Calcular score psicométrico de las respuestas
function calcPsicoScores(respuestas){
  const rasgosScore={};
  RASGOS.forEach(rasgo=>{
    let suma=0,count=0;
    rasgo.items.forEach(item=>{
      const val=respuestas[item.id];
      if(val!=null){
        const puntaje=item.invertido?(6-val):val; // invertir si aplica
        suma+=puntaje;count++;
      }
    });
    rasgosScore[rasgo.id]=count>0?Math.round((suma/(count*5))*100):0;
  });
  const total=Math.round(Object.values(rasgosScore).reduce((a,b)=>a+b,0)/RASGOS.length);
  return{rasgos:rasgosScore,total};
}

  const body={model:"claude-sonnet-4-20250514",max_tokens:max,messages:[{role:"user",content:user}]};
  if(sys)body.system=sys;
  const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!r.ok)throw new Error("API "+r.status);
  const d=await r.json();
  return d.content[0].text;
}

// PSICOMETRÍA WIDGET 
function PsicometriaWidget({onCompletar,nombre}){
  const todosItems=RASGOS.flatMap(r=>r.items.map(item=>({...item,rasgoId:r.id,rasgoNombre:r.nombre,rasgoIcono:r.icono})));
  const [idx,setIdx]=useState(0);
  const [respuestas,setRespuestas]=useState({});
  const [selActual,setSelActual]=useState(null);
  const total=todosItems.length;
  const item=todosItems[idx];
  const rasgoActual=RASGOS.find(r=>r.id===item.rasgoId);
  const progreso=Math.round((idx/total)*100);

  function responder(val){
    setSelActual(val);
    setTimeout(()=>{
      const nuevas={...respuestas,[item.id]:val};
      setRespuestas(nuevas);
      setSelActual(null);
      if(idx+1>=total){
        onCompletar(nuevas);
      } else {
        setIdx(idx+1);
      }
    },300);
  }

  return e(BotBubble,null,
    e("div",{style:{minWidth:280}},
      // Header de la sección
      idx===0&&e("div",{style:{marginBottom:16,padding:"12px 14px",background:"linear-gradient(135deg,"+IND+",#0c175c)",borderRadius:12,color:"#fff"}},
        e("div",{style:{fontSize:13,fontWeight:700,marginBottom:4}},"🧠 Evaluación Psicométrica"),
        e("p",{style:{fontSize:12,opacity:.85,lineHeight:1.5}},"Hola "+nombre+", el siguiente paso es una breve evaluación de "+total+" preguntas. No hay respuestas correctas o incorrectas — responde con honestidad.")
      ),
      // Progreso
      e("div",{style:{marginBottom:14}},
        e("div",{style:{display:"flex",justifyContent:"space-between",marginBottom:6}},
          e("span",{style:{fontSize:11,fontWeight:700,color:rasgoActual.color}},rasgoActual.icono+" "+rasgoActual.nombre),
          e("span",{style:{fontSize:11,color:"#aaa"}},(idx+1)+"/"+total)
        ),
        e("div",{className:"psico-progress"},e("div",{className:"psico-bar",style:{width:Math.max(3,progreso)+"%"}}))
      ),
      // Pregunta
      e("div",{style:{background:"#f8f9fb",borderRadius:12,padding:"14px 16px",marginBottom:14,borderLeft:"3px solid "+rasgoActual.color}},
        e("p",{style:{fontSize:14,color:"#1a1a2e",lineHeight:1.6,fontWeight:500}},item.texto)
      ),
      // Escala Likert
      e("div",{style:{marginBottom:8}},
        e("div",{style:{display:"flex",gap:4,marginBottom:6}},
          ...[1,2,3,4,5].map(val=>
            e("button",{
              key:val,
              className:"likert-btn"+(selActual===val?" likert-sel":""),
              onClick:()=>responder(val),
              style:{minHeight:64}
            },
              e("div",{style:{fontSize:16,marginBottom:4}},val),
              e("div",{style:{fontSize:9,lineHeight:1.3,opacity:.75}},LIKERT_LABELS[val-1])
            )
          )
        ),
        e("div",{style:{display:"flex",justifyContent:"space-between",fontSize:10,color:"#bbb",padding:"0 2px"}},
          e("span",null,"Totalmente en\ndesacuerdo"),
          e("span",null,"Totalmente de\nacuerdo")
        )
      )
    )
  );
}

// CHAT VIEW 
function ChatView({puesto,onBack}){
  const [msgs,setMsgs]=useState([]);
  const [input,setInput]=useState("");
  const [loading,setLoading]=useState(false);
  const [etapa,setEtapa]=useState("nombre");
  const [datos,setDatos]=useState({puesto_id:puesto.id,puesto_nombre:puesto.nombre});
  const [done,setDone]=useState(false);
  const [scoreInfo,setScoreInfo]=useState(null);
  const [esperandoCV,setEsperandoCV]=useState(false);
  const [esperandoPsico,setEsperandoPsico]=useState(false);

  const bottomRef=useRef(null);

  useEffect(()=>{
    setMsgs([{tipo:"bot",texto:"¡Hola! 👋 Soy el asistente de selección de **HM Talento Estratégico**.\n\nQuiero conocerte para la posición de **"+puesto.nombre+"** ("+puesto.area+").\n\nEl proceso toma solo 8 minutos e incluye una evaluación psicométrica. Comencemos: ¿cuál es tu **nombre completo**?"}]);
  },[]);
  useEffect(()=>{bottomRef.current&&bottomRef.current.scrollIntoView({behavior:"smooth"})},[msgs,loading,esperandoCV,esperandoPsico]);

  const addBot=t=>setMsgs(p=>[...p,{tipo:"bot",texto:t}]);
  const addUser=t=>setMsgs(p=>[...p,{tipo:"user",texto:t}]);

  async function enviar(){
    const val=input.trim();
    if(!val||loading||done||esperandoCV||esperandoPsico)return;
    setInput("");addUser(val);setLoading(true);
    try{await procesar(val)}catch(err){console.error(err);addBot("⚠️ Error de conexión. Intenta de nuevo.")}
    setLoading(false);
  }

  async function recibirCV(cvData,cvNombre){
    setEsperandoCV(false);
    setMsgs(p=>[...p,{tipo:"user",texto:cvNombre?"📎 "+cvNombre:"Prefiero omitir el CV por ahora"}]);
    // Guardar CV en datos y pasar a psicometría
    setDatos(d=>({...d,cvData,cvNombre}));
    addBot("¡Perfecto! 🎉 Has completado la entrevista de perfil.\n\nAhora aplicaremos una **evaluación psicométrica** breve ("+RASGOS.flatMap(r=>r.items).length+" preguntas). Responde con honestidad — no hay respuestas buenas o malas. Tus resultados son confidenciales.");
    setEsperandoPsico(true);
  }

  async function recibirPsico(respuestas){
    setEsperandoPsico(false);
    setMsgs(p=>[...p,{tipo:"user",texto:"✅ Evaluación psicométrica completada"}]);
    const psico=calcPsicoScores(respuestas);

    setLoading(true);
    try{await guardarCandidato(datos,psico)}
    catch(e){console.error(e);addBot("⚠️ Error al guardar. Intenta de nuevo.")}
    setLoading(false);
  }

  async function guardarCandidato(d,psicoScores){
    // 1. Guardar candidato PRIMERO con score provisional
    const scoreProvisional=psicoScores.total>=70?75:psicoScores.total>=55?65:45;
    const candidatoBase={
      ...d,score:scoreProvisional,psicoScores,
      id:Date.now().toString(),
      fecha:new Date().toISOString(),
      estatus:scoreProvisional>=75?"Preseleccionado":scoreProvisional>=55?"En revisión":"Descartado",
    };
    await insertCandidato(candidatoBase);

    // 2. Intentar mejorar score con Claude (si falla, el candidato ya está guardado)
        let msg="\u00a1Muchas gracias, "+d.nombre+"!\n\nHemos recibido tu expediente completo de manera exitosa, incluyendo tu entrevista de perfil y evaluaci\u00f3n.\n\nEl equipo de HM Talento Estrat\u00e9gico revisar\u00e1 tu informaci\u00f3n y se comunicar\u00e1 contigo a la brevedad posible por WhatsApp o correo electr\u00f3nico para informarte los siguientes pasos.\n\n\u00a1Exito en tu proceso!";
let scoreFinal=scoreProvisional;
    try{
      const prompt="Evalúa este candidato para "+d.puesto_nombre+" en HM Talento Estratégico.\n\nCANDIDATO:\n- Nombre: "+d.nombre+"\n- Experiencia: "+d.anos_experiencia+" años\n- Logros: "+d.logros+"\n- Disponibilidad: "+d.disponibilidad+"\n- Pretensión: "+d.pretension+"\n- CV: "+(d.cvNombre?"Sí ("+d.cvNombre+")":"No")+"\n\nREQUISITOS: "+puesto.requisitos+"\n\nINSTRUCCIONES:\n1. Escribe un mensaje de cierre cálido y profesional (2-3 párrafos). Agradece al candidato por su tiempo y por completar todo el proceso. NO menciones ningún puntaje, score, resultado ni calificación. Solo indícale que su expediente fue recibido exitosamente y que el equipo de HM Talento Estratégico se comunicará con él a la brevedad posible por WhatsApp o correo electrónico para informarle los siguientes pasos.\n2. Última línea exactamente: SCORE:XX";
      const resp=await callClaude(SYS,prompt,600);
      const match=resp.match(/SCORE:(\d+)/);
      scoreFinal=match?Math.min(100,Math.max(0,parseInt(match[1]))):scoreProvisional;
      msg=resp.replace(/SCORE:\d+/g,"").trim();
      // Actualizar score en la lista guardada
      await updateCandidato(candidatoBase.id,{estatus:scoreFinal>=75&&psicoScores.total>=70?"Preseleccionado":scoreFinal>=55&&psicoScores.total>=55?"En revisión":"Descartado"});
    }catch(err){console.warn("Claude no disponible, usando score provisional:",err);}
    addBot(msg);
    setScoreInfo({score:scoreFinal,label:scoreLabel(scoreFinal),color:scoreColor(scoreFinal)});
    setDone(true);
  }

  async function procesar(val){
    const d={...datos};
    // VALIDADORES
    const esEmail=v=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.trim());
    const esTel=v=>v.replace(/\D/g,"").length>=8;
    const fmtSalario=v=>{const n=parseFloat(v.replace(/[^0-9.]/g,""));return isNaN(n)||n<=0?null:"$"+n.toLocaleString("es-MX",{minimumFractionDigits:2,maximumFractionDigits:2});};

    if(etapa==="nombre"){
      if(val.trim().length<3||/^(.)\1+$/i.test(val.trim())){addBot("Por favor escribe tu **nombre completo**. Ejemplo: **Juan García López**");setLoading(false);return;}
      d.nombre=val.trim();setDatos(d);setEtapa("email");addBot("Mucho gusto, **"+d.nombre+"**. 😊 ¿Cuál es tu **correo electrónico**?");
    }
    else if(etapa==="email"){
      if(!esEmail(val)){addBot("El correo **"+val+"** no parece válido. Escríbelo completo. Ejemplo: **nombre@gmail.com**");setLoading(false);return;}
      d.email=val.trim().toLowerCase();setDatos(d);setEtapa("telefono");addBot("Perfecto. ¿Y tu **teléfono o WhatsApp** (10 dígitos)?");
    }
    else if(etapa==="telefono"){
      if(!esTel(val)){addBot("El número debe tener al menos **8 dígitos**. Ejemplo: **2381234567**");setLoading(false);return;}
      d.telefono=val.replace(/\D/g,"");setDatos(d);setEtapa("experiencia");addBot("Gracias. ¿Cuántos **años de experiencia** tienes en el área de "+puesto.area+"?");
    }
    else if(etapa==="experiencia"){
      const numMatch=val.match(/\d+/);
      if(!numMatch||parseInt(numMatch[0])>60){addBot("Por favor escribe solo el **número de años**. Ejemplo: **5**");setLoading(false);return;}
      d.anos_experiencia=String(parseInt(numMatch[0]));setDatos(d);setEtapa("logros");
      const r=await callClaude(SYS,"Candidato: "+d.nombre+", aplica a "+puesto.nombre+". Tiene "+d.anos_experiencia+" años en "+puesto.area+". Pídele en 2 oraciones sus logros más relevantes relacionados con: "+puesto.requisitos+".");
      addBot(r);
    }
    else if(etapa==="logros"){
      if(val.trim().length<10){addBot("Por favor describe con más detalle tu experiencia. Mínimo una oración completa.");setLoading(false);return;}
      d.logros=val;setDatos(d);setEtapa("disponibilidad");addBot("Muy bien. ¿Tienes **disponibilidad inmediata**? ¿En qué turno puedes trabajar?");
    }
    else if(etapa==="disponibilidad"){
      if(val.trim().length<3){addBot("Por favor indica tu disponibilidad. Ejemplo: **Inmediata, turno matutino**");setLoading(false);return;}
      d.disponibilidad=val;setDatos(d);setEtapa("pretension");addBot("Casi terminamos. ¿Cuál es tu **pretensión salarial mensual neta**? (Solo números, ejemplo: **8500**)");
    }
    else if(etapa==="pretension"){
      const salario=fmtSalario(val);
      if(!salario){addBot("Por favor escribe solo la cantidad en **números**. Ejemplo: **8500**");setLoading(false);return;}
      d.pretension=salario;setDatos(d);setEtapa("cv");setEsperandoCV(true);
    }
  }

  return e("div",{style:{minHeight:"100vh",display:"flex",flexDirection:"column",background:"#f4f6fb"}},
    // Header
    e("div",{style:{background:IND,color:"#fff",padding:"0 20px",height:60,display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0}},
      e("div",{style:{display:"flex",alignItems:"center",gap:10}},
        e("button",{onClick:onBack,style:{background:"none",border:"none",color:"#fff",fontSize:18,opacity:.7,cursor:"pointer"}},"←"),
        e("div",null,e("div",{style:{fontWeight:600,fontSize:15}},puesto.nombre),e("div",{style:{fontSize:11,opacity:.65}},puesto.area+" · Entrevista IA + Psicometría"))
      ),
      e("div",{style:{display:"flex",alignItems:"center",gap:6}},
        e("div",{className:"pulse",style:{width:8,height:8,borderRadius:"50%",background:"#22c55e"}}),
        e("span",{style:{fontSize:12,opacity:.75}},"En línea")
      )
    ),
    // Mensajes
    e("div",{style:{flex:1,overflowY:"auto",padding:"20px 16px",display:"flex",flexDirection:"column",gap:12}},
      ...msgs.map((m,i)=>m.tipo==="bot"?e(BotBubble,{key:i},e(RenderText,{text:m.texto})):e(UserBubble,{key:i,text:m.texto})),
      esperandoCV&&e(UploadWidget,{key:"upload",onEnviar:recibirCV}),
      esperandoPsico&&e(PsicometriaWidget,{key:"psico",onCompletar:recibirPsico,nombre:datos.nombre}),
      loading&&e("div",{key:"loading",style:{display:"flex",alignItems:"flex-end",gap:8}},
        e("div",{style:{width:30,height:30,borderRadius:"50%",background:IND,display:"flex",alignItems:"center",justifyContent:"center",fontSize:13}},"🤖"),
        e("div",{style:{background:"#fff",border:"1px solid #e4e8f0",borderRadius:"18px 18px 18px 4px",padding:"14px 18px",display:"flex",gap:5,alignItems:"center"}},
          ...[0,1,2].map(i=>e("div",{key:i,className:"pulse",style:{width:7,height:7,borderRadius:"50%",background:CEL,animationDelay:i*0.2+"s"}}))
        )
      ),


      e("div",{ref:bottomRef})
    ),
    // Input bar
    e("div",{style:{background:"#fff",borderTop:"1px solid #e4e8f0",padding:"14px 16px",display:"flex",gap:10,flexShrink:0}},
      done

function VacantesTab({onPuestosChange}){
  const [puestos,setPuestos]=useState(getPuestos);
  const [editando,setEditando]=useState(null);
  const [form,setForm]=useState({});
  const [nuevo,setNuevo]=useState(false);
  const AREAS=["Producción","Recursos Humanos","Ventas","Administración","Logística","TI","Dirección"];

  function guardar(){
    const lista=nuevo?[...puestos,{...form,id:"p_"+Date.now(),activo:true}]:puestos.map(p=>p.id===editando?{...p,...form}:p);
    savePuestos(lista);setPuestos(lista);setEditando(null);setNuevo(false);onPuestosChange();
  }
  function toggleActivo(id){const lista=puestos.map(p=>p.id===id?{...p,activo:!p.activo}:p);savePuestos(lista);setPuestos(lista);onPuestosChange();}
  function eliminar(id){if(!confirm("¿Eliminar?"))return;const lista=puestos.filter(p=>p.id!==id);savePuestos(lista);setPuestos(lista);onPuestosChange();}

        )
      )

              e("div",{style:{display:"flex",alignItems:"center",gap:10,marginBottom:6}},e("span",{className:"tag",style:{background:bg,color:fg}},p.area),e("span",{style:{fontSize:12,fontWeight:600,color:p.activo?"#22c55e":"#aaa"}},p.activo?"● Activa":"○ Inactiva")),

// APP 
function App(){
  const [vista,setVista]=useState("home");
  const [puesto,setPuesto]=useState(null);
  const [loginPass,setLoginPass]=useState("");
  const [loginError,setLoginError]=useState("");
  const [puestos,setPuestosState]=useState(()=>getPuestos().filter(p=>p.activo));
  const [showCsv,setShowCsv]=useState(false);
  const [cvCand,setCvCand]=useState(null);
  useEffect(()=>{
    const onCsv=()=>setShowCsv(true);
    window._csvModalShow=onCsv;
    window.addEventListener("hm_show_csv",onCsv);
    // CV: store candidate directly in state (no event timing issues)
    window._cvShowFn=(c)=>{setCvCand(c);};
    return()=>{
      window.removeEventListener("hm_show_csv",onCsv);
    };
  },[]);
  function recargar(){setPuestosState(getPuestos().filter(p=>p.activo))}
  return e("div",{style:{fontFamily:"'Segoe UI',sans-serif",minHeight:"100vh",background:"#f4f6fb"}},
    vista==="home"&&e(HomeView,{puestos,onCandidato:p=>{setPuesto(p);setVista("chat")},onLogin:()=>{setLoginError("");setVista("login")}}),
    vista==="login"&&e(LoginView,{pass:loginPass,setPass:setLoginPass,onLogin:()=>{if(loginPass==="HMtalento2024"){setLoginError("");setVista("panel")}else setLoginError("Contraseña incorrecta.")},error:loginError,onBack:()=>setVista("home")}),
    vista==="chat"&&e(ChatView,{puesto,onBack:()=>setVista("home")}),
    vista==="panel"&&e(PanelView,{onBack:()=>setVista("home"),onPuestosChange:recargar}),
    showCsv&&e(CsvModal,{onClose:()=>setShowCsv(false)}),
    cvCand&&e(CvModal,{cand:cvCand,onClose:()=>setCvCand(null)})
  );
}

// ── MODALES DE DESCARGA ───────────────────────────────────────────
function CsvModal({onClose}){
  const [csv,setCsv]=useState("");
  const [copiado,setCopiado]=useState(false);
  useEffect(()=>{
    setCsv(window._csvData||"");
    const handler=()=>setCsv(window._csvData||"");
    window.addEventListener("hm_show_csv",handler);
    return()=>window.removeEventListener("hm_show_csv",handler);
  },[]);
  function copiar(){
    navigator.clipboard.writeText(csv).then(()=>{setCopiado(true);setTimeout(()=>setCopiado(false),2500);}).catch(()=>{
      const ta=document.createElement("textarea");ta.value=csv;document.body.appendChild(ta);ta.select();document.execCommand("copy");document.body.removeChild(ta);setCopiado(true);setTimeout(()=>setCopiado(false),2500);
    });
  }
  if(!csv)return null;
  const filas=csv.split("\r\n").length-1;
  return e("div",{style:{position:"fixed",inset:0,background:"rgba(0,0,0,.6)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:9999}},
    e("div",{className:"card",style:{width:"min(680px,95vw)",maxHeight:"85vh",display:"flex",flexDirection:"column",overflow:"hidden",boxShadow:"0 20px 60px rgba(0,0,0,.3)"}},
      e("div",{style:{background:IND,padding:"18px 22px",color:"#fff",display:"flex",justifyContent:"space-between",alignItems:"center"}},
        e("div",null,
          e("div",{style:{fontSize:16,fontWeight:700}},"Exportar candidatos"),
          e("div",{style:{fontSize:12,opacity:.75,marginTop:2}},filas+" candidatos · Listo para pegar en Excel")
        ),
        e("button",{onClick:onClose,style:{background:"none",border:"none",color:"#fff",fontSize:20,cursor:"pointer"}},"✕")
      ),
      e("div",{style:{padding:"20px 22px",flex:1,overflowY:"auto"}},
        e("div",{style:{background:"#f0fff4",border:"1.5px solid #86efac",borderRadius:10,padding:"12px 16px",marginBottom:16,fontSize:13,color:"#166534",lineHeight:1.6}},
          "✅ ",e("strong",null,"Instrucciones:"),
          " Haz clic en ",e("strong",null,"Copiar datos"),", abre Excel, selecciona la celda A1 y presiona ",e("strong",null,"Cmd+V")," (Mac) o ",e("strong",null,"Ctrl+V")," (Windows) — los datos quedarán separados en columnas automáticamente."
        ),
        e("textarea",{
          readOnly:true,
          value:csv,
          style:{width:"100%",height:200,fontFamily:"monospace",fontSize:11,border:"1.5px solid #e5e7eb",borderRadius:8,padding:"10px",resize:"vertical",outline:"none",background:"#fafafa"}
        })
      ),
      e("div",{style:{padding:"14px 22px",borderTop:"1px solid #f0f0f5",display:"flex",gap:10}},
        e("button",{onClick:copiar,className:"bpri",style:{flex:1,fontSize:14}},
          copiado?"✅ ¡Copiado! Pega en Excel":"📋 Copiar datos para Excel"
        ),
        e("button",{onClick:onClose,className:"bghost",style:{fontSize:13}},"Cerrar")
      )
    )
  );
}

function CvModal({onClose}){
  const [cand,setCand]=useState(null);
  const [blobUrl,setBlobUrl]=useState(null);
  const [abriendo,setAbriendo]=useState(false);

  useEffect(()=>{
    function loadCv(){
      const c=window._cvCandidate||null;
      setCand(c);
      if(c&&c.cvData){
        try{
          const parts=c.cvData.split(",");
          const mime=parts[0].match(/:(.*?);/)[1];
          const bin=atob(parts[1]);
          const buf=new Uint8Array(bin.length);
          for(let j=0;j<bin.length;j++) buf[j]=bin.charCodeAt(j);
          const url=URL.createObjectURL(new Blob([buf],{type:mime}));
          setBlobUrl(url);
        }catch(err){console.warn("blob err:",err);setBlobUrl(null);}
      }
    }
    loadCv();
    window.addEventListener("hm_show_cv",loadCv);
    return()=>{window.removeEventListener("hm_show_cv",loadCv);};
  },[]);

  function handleClose(){if(blobUrl)URL.revokeObjectURL(blobUrl);setBlobUrl(null);setCand(null);onClose();}

  function handleDescargar(){
    if(!blobUrl||!cand)return;
    const a=document.createElement("a");
    a.href=blobUrl;a.download=cand.cvNombre;
    document.body.appendChild(a);a.click();
    setTimeout(()=>document.body.removeChild(a),100);
  }

  function handleVerPDF(){
    if(!blobUrl)return;
    setAbriendo(true);
    window.open(blobUrl,"_blank");
    setTimeout(()=>setAbriendo(false),1500);
  }

  if(!cand||!cand.cvData)return null;
  const esPDF=cand.cvData.includes("application/pdf");

  return e("div",{style:{position:"fixed",inset:0,background:"rgba(0,0,0,.7)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:9999}},
    e("div",{className:"card",style:{width:"min(500px,94vw)",overflow:"hidden",boxShadow:"0 20px 60px rgba(0,0,0,.4)"}},
      e("div",{style:{background:IND,padding:"18px 22px",color:"#fff",display:"flex",justifyContent:"space-between",alignItems:"center"}},
        e("div",{style:{display:"flex",alignItems:"center",gap:10}},
          e("span",{style:{fontSize:22}},"📎"),
          e("div",null,
            e("div",{style:{fontWeight:700,fontSize:15}},cand.cvNombre),
            e("div",{style:{fontSize:11,opacity:.75,marginTop:2}},cand.nombre+" · "+cand.puesto_nombre)
          )
        ),
        e("button",{onClick:handleClose,style:{background:"none",border:"none",color:"#fff",fontSize:22,cursor:"pointer",lineHeight:1,opacity:.8}},"✕")
      ),
      e("div",{style:{padding:"28px 24px",textAlign:"center",background:"#f8f9fb"}},
        e("div",{style:{fontSize:52,marginBottom:16}},esPDF?"📄":"📝"),
        e("div",{style:{fontSize:15,fontWeight:600,color:"#333",marginBottom:8}},cand.cvNombre),
        e("div",{style:{fontSize:13,color:"#888",marginBottom:24}},esPDF?"Documento PDF":"Documento Word"),
        e("div",{style:{display:"flex",gap:12,justifyContent:"center",flexWrap:"wrap"}},
          esPDF&&blobUrl&&e("button",{
            onClick:handleVerPDF,
            className:"bpri",
            style:{padding:"11px 22px",fontSize:14,display:"flex",alignItems:"center",gap:8}
          },abriendo?"Abriendo...":"👁 Ver PDF"),
          blobUrl&&e("button",{
            onClick:handleDescargar,
            style:{padding:"11px 22px",fontSize:14,fontWeight:600,background:CEL,color:"#fff",border:"none",borderRadius:10,cursor:"pointer",display:"flex",alignItems:"center",gap:8}
          },"⬇ Descargar")
        ),
        !blobUrl&&e("div",{style:{color:"#aaa",fontSize:13,marginTop:8}},"Preparando archivo...")
      )
    )
  );
}


window.addEventListener("load",()=>{
  document.getElementById("loading-screen").style.display="none";
  ReactDOM.createRoot(document.getElementById("root")).render(e(App,null));
});
