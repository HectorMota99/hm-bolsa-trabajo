function scoreColor(s){return s>=75?"#22c55e":s>=55?"#f59e0b":"#ef4444"}
function scoreLabel(s){return s>=75?"Alto potencial ✓":s>=55?"A evaluar":"No califica"}
function psicoColor(s){return s>=80?"#22c55e":s>=60?"#f59e0b":"#ef4444"}
function psicoLabel(s){return s>=80?"Favorable ✓":s>=60?"Moderado":"Bajo — Revisar"}
function formatDate(iso){if(!iso)return"—";return new Date(iso).toLocaleDateString("es-MX",{day:"2-digit",month:"short",year:"numeric"})}

// Calcular score psicométrico de las respuestas
function calcPsicoScores(respuestas){
  const rasgosScore={};
  RASGOS.forEach(rasgo=>{
    let suma=0,count=0;
    rasgo.items.forEach(item=>{
      const val=respuestas[item.id];
      if(val!=null){
        const puntaje=item.invertido?(6-val):val; // invertir si aplica
        suma+=puntaje;count++;
      }
    });
    rasgosScore[rasgo.id]=count>0?Math.round((suma/(count*5))*100):0;
  });
  const total=Math.round(Object.values(rasgosScore).reduce((a,b)=>a+b,0)/RASGOS.length);
  return{rasgos:rasgosScore,total};
}

async function callClaude(sys,user,max=400){
  const body={model:"claude-sonnet-4-20250514",max_tokens:max,messages:[{role:"user",content:user}]};
  if(sys)body.system=sys;
  const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!r.ok)throw new Error("API "+r.status);
  const d=await r.json();
  return d.content[0].text;
}

function exportCSV(lista){
  const h=["Nombre","Email","Teléfono","Puesto","Experiencia","Disponibilidad","Pretensión","Score Perfil","Score Psico","Honestidad","Tolerancia Estrés","Orient. Resultados","Trabajo Equipo","Responsabilidad","Estatus","Fecha","CV"];
  const rows=lista.map(c=>[
    c.nombre,c.email,c.telefono,c.puesto_nombre,c.anos_experiencia,c.disponibilidad,c.pretension,
    c.score+"/100",
    c.psicoScores?c.psicoScores.total+"/100":"—",
    c.psicoScores?c.psicoScores.rasgos.honestidad+"/100":"—",
    c.psicoScores?c.psicoScores.rasgos.tolerancia+"/100":"—",
    c.psicoScores?c.psicoScores.rasgos.resultados+"/100":"—",
    c.psicoScores?c.psicoScores.rasgos.equipo+"/100":"—",
    c.psicoScores?c.psicoScores.rasgos.responsabilidad+"/100":"—",
    c.estatus,formatDate(c.fecha),c.cvNombre?"Sí":"No"
  ]);
  const csv=[h,...rows].map(r=>r.map(v=>'"'+String(v||"").replace(/"/g,'""')+'"').join(",")).join("\n");
  const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8;"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="candidatos_hm.csv";a.click();
}

function downloadCV(c){
  if(!c.cvData||!c.cvNombre)return;
  const b64=c.cvData.split(",")[1];
  const bytes=atob(b64);
  const ab=new ArrayBuffer(bytes.length);
  const ia=new Uint8Array(ab);
  for(let i=0;i<bytes.length;i++)ia[i]=bytes.charCodeAt(i);
  const mime=c.cvData.split(";")[0].split(":")[1];
  const blob=new Blob([ab],{type:mime});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=c.cvNombre;a.click();
}

// ── RENDER TEXT ───────────────────────────────────────────────────
function RenderText({text}){
  if(!text)return null;
  return e(React.Fragment,null,...text.split(/(\*\*[^*]+\*\*)/).map((p,i)=>
    p.startsWith("**")?e("strong",{key:i},p.slice(2,-2)):p
  ));
}

// ── UPLOAD WIDGET ─────────────────────────────────────────────────
function UploadWidget({onEnviar}){
  const [cvFile,setCvFile]=useState(null);
  const [drag,setDrag]=useState(false);
  const [enviando,setEnviando]=useState(false);
  const fileRef=useRef(null);
  function handleFile(f){
    if(!f)return;
    const ok=["application/pdf","application/msword","application/vnd.openxmlformats-officedocument.wordprocessingml.document"];
    if(!ok.includes(f.type)){alert("Solo PDF o Word");return;}
    if(f.size>5*1024*1024){alert("Máximo 5 MB");return;}
    setCvFile(f);
  }
  async function submit(omitir){
    setEnviando(true);
    let cvData=null,cvNombre=null;
    if(!omitir&&cvFile){
      cvData=await new Promise((res,rej)=>{const r=new FileReader();r.onload=ev=>res(ev.target.result);r.onerror=rej;r.readAsDataURL(cvFile);});
      cvNombre=cvFile.name;
    }
    onEnviar(cvData,cvNombre);
  }
  return e(BotBubble,null,
    e("div",{style:{minWidth:260}},
      e("p",{style:{fontSize:14,marginBottom:14,lineHeight:1.6}},"📋 Para darte seguimiento oportuno adjunta tu ",e("strong",null,"CV o carta de presentación")," en ",e("strong",null,"PDF o Word"),". 👇"),
      e("div",{
        className:"upload-zone",
        style:{marginBottom:12,background:cvFile?"#f0fff4":drag?"#f0faff":"#fafafa",borderColor:cvFile?"#22c55e":drag?CEL:"#d1d5db"},
        onDragOver:ev=>{ev.preventDefault();setDrag(true)},
        onDragLeave:()=>setDrag(false),
        onDrop:ev=>{ev.preventDefault();setDrag(false);handleFile(ev.dataTransfer.files[0])},
        onClick:()=>!enviando&&fileRef.current&&fileRef.current.click()
      },
        e("input",{ref:fileRef,type:"file",accept:".pdf,.doc,.docx",style:{display:"none"},onChange:ev=>handleFile(ev.target.files[0])}),
        cvFile
          ? e("div",null,e("div",{style:{fontSize:28,marginBottom:6}},"✅"),e("div",{style:{fontWeight:700,color:"#166534",fontSize:14}},cvFile.name),e("div",{style:{fontSize:12,color:"#888",marginTop:3}},(cvFile.size/1024).toFixed(0)+" KB · Toca para cambiar"))
          : e("div",null,e("div",{style:{fontSize:32,marginBottom:8}},"📎"),e("div",{style:{fontWeight:600,color:"#555",fontSize:14,marginBottom:4}},"Arrastra tu CV aquí"),e("div",{style:{fontSize:12,color:"#999"}},"PDF · Word · Máx. 5 MB"),e("div",{style:{marginTop:10,display:"inline-block",padding:"7px 18px",background:CEL,color:"#fff",borderRadius:8,fontSize:13,fontWeight:600}},"Seleccionar archivo"))
      ),
      e("div",{style:{display:"flex",gap:8}},
        e("button",{onClick:()=>submit(false),disabled:!cvFile||enviando,className:"bpri",style:{flex:2,fontSize:13,padding:"10px 14px",opacity:(!cvFile||enviando)?.5:1}},enviando?"Enviando...":"📤 Enviar CV y continuar"),
        e("button",{onClick:()=>submit(true),disabled:enviando,style:{flex:1,fontSize:12,padding:"10px 14px",border:"1.5px solid #d1d5db",borderRadius:10,background:"transparent",color:"#888",fontWeight:500,cursor:"pointer"}},"Omitir")
      ),
      e("p",{style:{fontSize:11,color:"#bbb",marginTop:8,textAlign:"center"}},"Tu información se maneja de forma confidencial")
    )
  );
}

// ── PSICOMETRÍA WIDGET ────────────────────────────────────────────
function PsicometriaWidget({onCompletar,nombre}){
  const todosItems=RASGOS.flatMap(r=>r.items.map(item=>({...item,rasgoId:r.id,rasgoNombre:r.nombre,rasgoIcono:r.icono})));
  const [idx,setIdx]=useState(0);
  const [respuestas,setRespuestas]=useState({});
  const [selActual,setSelActual]=useState(null);
  const total=todosItems.length;
  const item=todosItems[idx];
  const rasgoActual=RASGOS.find(r=>r.id===item.rasgoId);
  const progreso=Math.round((idx/total)*100);

  function responder(val){
    setSelActual(val);
    setTimeout(()=>{
      const nuevas={...respuestas,[item.id]:val};
      setRespuestas(nuevas);
      setSelActual(null);
      if(idx+1>=total){
        onCompletar(nuevas);
      } else {
        setIdx(idx+1);
      }
    },300);
  }

  return e(BotBubble,null,
    e("div",{style:{minWidth:280}},
      // Header de la sección
      idx===0&&e("div",{style:{marginBottom:16,padding:"12px 14px",background:"linear-gradient(135deg,"+IND+",#0c175c)",borderRadius:12,color:"#fff"}},
        e("div",{style:{fontSize:13,fontWeight:700,marginBottom:4}},"🧠 Evaluación Psicométrica"),
        e("p",{style:{fontSize:12,opacity:.85,lineHeight:1.5}},"Hola "+nombre+", el siguiente paso es una breve evaluación de "+total+" preguntas. No hay respuestas correctas o incorrectas — responde con honestidad.")
      ),
      // Progreso
      e("div",{style:{marginBottom:14}},
        e("div",{style:{display:"flex",justifyContent:"space-between",marginBottom:6}},
          e("span",{style:{fontSize:11,fontWeight:700,color:rasgoActual.color}},rasgoActual.icono+" "+rasgoActual.nombre),
          e("span",{style:{fontSize:11,color:"#aaa"}},(idx+1)+"/"+total)
        ),
        e("div",{className:"psico-progress"},e("div",{className:"psico-bar",style:{width:Math.max(3,progreso)+"%"}}))
      ),
      // Pregunta
      e("div",{style:{background:"#f8f9fb",borderRadius:12,padding:"14px 16px",marginBottom:14,borderLeft:"3px solid "+rasgoActual.color}},
        e("p",{style:{fontSize:14,color:"#1a1a2e",lineHeight:1.6,fontWeight:500}},item.texto)
      ),
      // Escala Likert
      e("div",{style:{marginBottom:8}},
        e("div",{style:{display:"flex",gap:4,marginBottom:6}},
          ...[1,2,3,4,5].map(val=>
            e("button",{
              key:val,
              className:"likert-btn"+(selActual===val?" likert-sel":""),
              onClick:()=>responder(val),
              style:{minHeight:64}
            },
              e("div",{style:{fontSize:16,marginBottom:4}},val),
              e("div",{style:{fontSize:9,lineHeight:1.3,opacity:.75}},LIKERT_LABELS[val-1])
            )
          )
        ),
        e("div",{style:{display:"flex",justifyContent:"space-between",fontSize:10,color:"#bbb",padding:"0 2px"}},
          e("span",null,"Totalmente en\ndesacuerdo"),
          e("span",null,"Totalmente de\nacuerdo")
        )
      )
    )
  );
}

// ── CHAT VIEW ─────────────────────────────────────────────────────
function ChatView({puesto,onBack}){
  const [msgs,setMsgs]=useState([]);
  const [input,setInput]=useState("");
  const [loading,setLoading]=useState(false);
  const [etapa,setEtapa]=useState("nombre");
  const [datos,setDatos]=useState({puesto_id:puesto.id,puesto_nombre:puesto.nombre});
  const [done,setDone]=useState(false);
  const [scoreInfo,setScoreInfo]=useState(null);
  const [esperandoCV,setEsperandoCV]=useState(false);
  const [esperandoPsico,setEsperandoPsico]=useState(false);
  const [psicoResult,setPsicoResult]=useState(null);
  const bottomRef=useRef(null);

  useEffect(()=>{
    setMsgs([{tipo:"bot",texto:"¡Hola! 👋 Soy el asistente de selección de **HM Talento Estratégico**.\n\nQuiero conocerte para la posición de **"+puesto.nombre+"** ("+puesto.area+").\n\nEl proceso toma solo 8 minutos e incluye una evaluación psicométrica. Comencemos: ¿cuál es tu **nombre completo**?"}]);
  },[]);
  useEffect(()=>{bottomRef.current&&bottomRef.current.scrollIntoView({behavior:"smooth"})},[msgs,loading,esperandoCV,esperandoPsico]);

  const addBot=t=>setMsgs(p=>[...p,{tipo:"bot",texto:t}]);
  const addUser=t=>setMsgs(p=>[...p,{tipo:"user",texto:t}]);

  async function enviar(){
    const val=input.trim();
    if(!val||loading||done||esperandoCV||esperandoPsico)return;
    setInput("");addUser(val);setLoading(true);
    try{await procesar(val)}catch(err){console.error(err);addBot("⚠️ Error de conexión. Intenta de nuevo.")}
    setLoading(false);
  }

  async function recibirCV(cvData,cvNombre){
    setEsperandoCV(false);
    setMsgs(p=>[...p,{tipo:"user",texto:cvNombre?"📎 "+cvNombre:"Prefiero omitir el CV por ahora"}]);
    // Guardar CV en datos y pasar a psicometría
    setDatos(d=>({...d,cvData,cvNombre}));
    addBot("¡Perfecto! 🎉 Has completado la entrevista de perfil.\n\nAhora aplicaremos una **evaluación psicométrica** breve ("+RASGOS.flatMap(r=>r.items).length+" preguntas). Responde con honestidad — no hay respuestas buenas o malas. Tus resultados son confidenciales.");
    setEsperandoPsico(true);
  }

  async function recibirPsico(respuestas){
    setEsperandoPsico(false);
    setMsgs(p=>[...p,{tipo:"user",texto:"✅ Evaluación psicométrica completada"}]);
    const psico=calcPsicoScores(respuestas);
    setPsicoResult({scores:psico,nombre:datos.nombre});
    setLoading(true);
    try{await guardarCandidato(datos,psico)}
    catch(e){console.error(e);addBot("⚠️ Error al guardar. Intenta de nuevo.")}
    setLoading(false);
  }

  async function guardarCandidato(d,psicoScores){
    const prompt="Evalúa este candidato para "+d.puesto_nombre+" en HM Talento Estratégico.\n\nCANDIDATO:\n- Nombre: "+d.nombre+"\n- Experiencia: "+d.anos_experiencia+" años\n- Logros: "+d.logros+"\n- Disponibilidad: "+d.disponibilidad+"\n- Pretensión: "+d.pretension+"\n- CV: "+(d.cvNombre?"Sí ("+d.cvNombre+")":"No")+"\n\nREQUISITOS: "+puesto.requisitos+"\n\nINSTRUCCIONES:\n1. Mensaje de cierre cálido y profesional (2-3 párrafos). Menciona que completó exitosamente tanto la entrevista como la evaluación psicométrica. Dile que el equipo revisará su expediente completo en 2-3 días hábiles y lo contactarán por WhatsApp o correo.\n2. Última línea exactamente: SCORE:XX";
    const resp=await callClaude(SYS,prompt,600);
    const match=resp.match(/SCORE:(\d+)/);
    const score=match?Math.min(100,Math.max(0,parseInt(match[1]))):60;
    const msg=resp.replace(/SCORE:\d+/g,"").trim();
    const candidato={
      ...d,score,psicoScores,
      id:Date.now().toString(),
      fecha:new Date().toISOString(),
      estatus:score>=75&&psicoScores.total>=70?"Preseleccionado":score>=55&&psicoScores.total>=55?"En revisión":"Descartado",
    };
    const lista=getCandidatos();lista.push(candidato);saveCandidatos(lista);
    addBot(msg);
    setScoreInfo({score,label:scoreLabel(score),color:scoreColor(score)});
    setDone(true);
  }

  async function procesar(val){
    const d={...datos};
    if(etapa==="nombre"){d.nombre=val;setDatos(d);setEtapa("email");addBot("Mucho gusto, **"+val+"**. 😊 ¿Cuál es tu **correo electrónico**?")}
    else if(etapa==="email"){d.email=val;setDatos(d);setEtapa("telefono");addBot("Perfecto. ¿Y tu **teléfono o WhatsApp**?")}
    else if(etapa==="telefono"){d.telefono=val;setDatos(d);setEtapa("experiencia");addBot("Gracias. ¿Cuántos **años de experiencia** tienes en el área de "+puesto.area+"?")}
    else if(etapa==="experiencia"){d.anos_experiencia=val;setDatos(d);setEtapa("logros");
      const r=await callClaude(SYS,"Candidato: "+d.nombre+", aplica a "+puesto.nombre+". Tiene "+val+" años en "+puesto.area+". Pídele en 2 oraciones sus logros más relevantes relacionados con: "+puesto.requisitos+".");
      addBot(r);
    }
    else if(etapa==="logros"){d.logros=val;setDatos(d);setEtapa("disponibilidad");addBot("Muy bien. ¿Tienes **disponibilidad inmediata**? ¿En qué turno puedes trabajar?")}
    else if(etapa==="disponibilidad"){d.disponibilidad=val;setDatos(d);setEtapa("pretension");addBot("Casi terminamos la entrevista. ¿Cuál es tu **pretensión salarial mensual** (neto)?")}
    else if(etapa==="pretension"){d.pretension=val;setDatos(d);setEtapa("cv");setEsperandoCV(true)}
  }

  return e("div",{style:{minHeight:"100vh",display:"flex",flexDirection:"column",background:"#f4f6fb"}},
    // Header
    e("div",{style:{background:IND,color:"#fff",padding:"0 20px",height:60,display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0}},
      e("div",{style:{display:"flex",alignItems:"center",gap:10}},
        e("button",{onClick:onBack,style:{background:"none",border:"none",color:"#fff",fontSize:18,opacity:.7,cursor:"pointer"}},"←"),
        e("div",null,e("div",{style:{fontWeight:600,fontSize:15}},puesto.nombre),e("div",{style:{fontSize:11,opacity:.65}},puesto.area+" · Entrevista IA + Psicometría"))
      ),
      e("div",{style:{display:"flex",alignItems:"center",gap:6}},
        e("div",{className:"pulse",style:{width:8,height:8,borderRadius:"50%",background:"#22c55e"}}),
        e("span",{style:{fontSize:12,opacity:.75}},"En línea")
      )
    ),
    // Mensajes
    e("div",{style:{flex:1,overflowY:"auto",padding:"20px 16px",display:"flex",flexDirection:"column",gap:12}},
      ...msgs.map((m,i)=>m.tipo==="bot"?e(BotBubble,{key:i},e(RenderText,{text:m.texto})):e(UserBubble,{key:i,text:m.texto})),
      esperandoCV&&e(UploadWidget,{key:"upload",onEnviar:recibirCV}),
      esperandoPsico&&e(PsicometriaWidget,{key:"psico",onCompletar:recibirPsico,nombre:datos.nombre}),
      loading&&e("div",{key:"loading",style:{display:"flex",alignItems:"flex-end",gap:8}},
        e("div",{style:{width:30,height:30,borderRadius:"50%",background:IND,display:"flex",alignItems:"center",justifyContent:"center",fontSize:13}},"🤖"),
        e("div",{style:{background:"#fff",border:"1px solid #e4e8f0",borderRadius:"18px 18px 18px 4px",padding:"14px 18px",display:"flex",gap:5,alignItems:"center"}},
          ...[0,1,2].map(i=>e("div",{key:i,className:"pulse",style:{width:7,height:7,borderRadius:"50%",background:CEL,animationDelay:i*0.2+"s"}}))
        )
      ),
      psicoResult&&e(ResultadoPsico,{key:"pres",psicoScores:psicoResult.scores,nombre:psicoResult.nombre}),
      scoreInfo&&e("div",{key:"score",className:"fadein",style:{background:"#fff",border:"2px solid "+scoreInfo.color,borderRadius:14,padding:"16px 20px",textAlign:"center",margin:"4px 0"}},
        e("div",{style:{fontSize:12,color:"#888",marginBottom:4}},"Score de perfil profesional"),
        e("div",{style:{fontSize:36,fontWeight:800,color:scoreInfo.color}},scoreInfo.score,e("span",{style:{fontSize:18}},"/100")),
        e("div",{style:{fontSize:14,fontWeight:600,color:scoreInfo.color,marginTop:4}},scoreInfo.label)
      ),
      e("div",{ref:bottomRef})
    ),
    // Input bar
    e("div",{style:{background:"#fff",borderTop:"1px solid #e4e8f0",padding:"14px 16px",display:"flex",gap:10,flexShrink:0}},
      done
        ?e("button",{onClick:onBack,className:"bghost",style:{width:"100%"}},"← Volver a vacantes")
        :(esperandoCV||esperandoPsico)
          ?e("div",{style:{width:"100%",textAlign:"center",fontSize:13,color:"#bbb",padding:"4px 0"}},esperandoCV?"Adjunta tu CV arriba":"Responde la evaluación psicométrica arriba")
          :e(React.Fragment,null,
              e("input",{value:input,onChange:ev=>setInput(ev.target.value),onKeyDown:ev=>ev.key==="Enter"&&!ev.shiftKey&&enviar(),placeholder:"Escribe tu respuesta...",disabled:loading,style:{flex:1,padding:"11px 15px",border:"1.5px solid #e5e7eb",borderRadius:12,fontSize:14,outline:"none",background:loading?"#f9f9f9":"#fff"}}),
              e("button",{onClick:enviar,disabled:loading||!input.trim(),className:"bpri",style:{padding:"11px 18px"}},"→")
            )
    )
  );
}

            e("div",{key:i,style:{marginBottom:12}},

              e("div",{style:{fontSize:14,color:"#111"}},v||"—")
            )
          ),
          sel.logros&&e("div",{style:{marginBottom:12}},
            e("div",{style:{fontSize:10,fontWeight:700,color:"#aaa",textTransform:"uppercase",letterSpacing:.5,marginBottom:6}},"Logros"),
            e("div",{style:{fontSize:13,color:"#444",lineHeight:1.6,background:"#f8f9fb",padding:"10px 12px",borderRadius:8}},sel.logros)
          ),
          sel.cvNombre&&e("div",{style:{background:"#f0f5ff",borderRadius:10,padding:"12px 14px",display:"flex",alignItems:"center",justifyContent:"space-between"}},
            e("div",{style:{display:"flex",alignItems:"center",gap:8}},e("span",{style:{fontSize:20}},"📎"),e("div",null,e("div",{style:{fontSize:13,fontWeight:600,color:IND}},sel.cvNombre),e("div",{style:{fontSize:11,color:"#888"}},"Currículum adjunto"))),
            e("button",{onClick:()=>downloadCV(sel),className:"bcel",style:{fontSize:12,padding:"6px 12px"}},"⬇ Descargar")
          )
        ),
        // Tab: Psicometría
        tabDet==="psico"&&e("div",{style:{padding:"16px 22px"}},
          sel.psicoScores
            ?e("div",null,
                e("div",{style:{textAlign:"center",marginBottom:16,padding:"14px",background:"#f8f9fb",borderRadius:12}},
                  e("div",{style:{fontSize:11,color:"#888",marginBottom:4}},"Score psicométrico global"),
                  e("div",{style:{fontSize:32,fontWeight:800,color:psicoColor(sel.psicoScores.total)}},sel.psicoScores.total,e("span",{style:{fontSize:16}},"/100")),
                  e("div",{style:{fontSize:13,fontWeight:600,color:psicoColor(sel.psicoScores.total)}},psicoLabel(sel.psicoScores.total))
                ),
                ...RASGOS.map(rasgo=>{
                  const val=sel.psicoScores.rasgos[rasgo.id]||0;
                  return e("div",{key:rasgo.id,style:{marginBottom:14}},
                    e("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}},
                      e("div",{style:{display:"flex",alignItems:"center",gap:6}},
                        e("span",{style:{fontSize:16}},rasgo.icono),
                        e("span",{style:{fontSize:12,fontWeight:600,color:rasgo.color}},rasgo.nombre)
                      ),
                      e("div",{style:{display:"flex",alignItems:"center",gap:6}},
                        e("span",{style:{fontSize:14,fontWeight:800,color:psicoColor(val)}},val),
                        e("span",{style:{fontSize:10,color:"#aaa"}},"/100")
                      )
                    ),
                    e("div",{style:{height:8,background:"#f0f0f5",borderRadius:4,overflow:"hidden"}},
                      e("div",{style:{height:"100%",width:val+"%",background:rasgo.color,borderRadius:4,transition:"width .5s"}})

                    e("div",{style:{fontSize:10,color:psicoColor(val),fontWeight:600,marginTop:3}},psicoLabel(val))
                  );
                })

        ),
        // Tab: Acciones

          e("div",{style:{fontSize:11,fontWeight:700,color:"#888",marginBottom:8}},"CAMBIAR ESTATUS"),
          e("div",{style:{display:"flex",gap:6,flexWrap:"wrap",marginBottom:16}},
            ...["Preseleccionado","En revisión","Descartado","Contratado"].map(est=>
              e("button",{key:est,onClick:()=>cambiarEstatus(sel.id,est),style:{padding:"8px 12px",borderRadius:8,fontSize:12,fontWeight:700,border:"none",background:sel.estatus===est?IND:"#f3f4f6",color:sel.estatus===est?"#fff":"#555",cursor:"pointer"}},est)
            )
          ),
          e("div",{style:{fontSize:11,color:"#aaa",marginBottom:16,padding:"10px 12px",background:"#fafafa",borderRadius:8,lineHeight:1.5}},"⚡ El estatus se calcula automáticamente según score de perfil y psicometría. Puedes ajustarlo manualmente aquí."),
          e("button",{onClick:()=>eliminar(sel.id),style:{width:"100%",padding:"10px",borderRadius:8,fontSize:13,border:"1.5px solid #fee2e2",background:"transparent",color:"#ef4444",fontWeight:600,cursor:"pointer"}},"🗑 Eliminar candidato")
        )
      )
    )
  );
}

// ── VACANTES TAB ──────────────────────────────────────────────────
function VacantesTab({onPuestosChange}){
  const [puestos,setPuestos]=useState(getPuestos);
  const [editando,setEditando]=useState(null);
  const [form,setForm]=useState({});
  const [nuevo,setNuevo]=useState(false);
  const AREAS=["Producción","Recursos Humanos","Ventas","Administración","Logística","TI","Dirección"];

  function guardar(){
    const lista=nuevo?[...puestos,{...form,id:"p_"+Date.now(),activo:true}]:puestos.map(p=>p.id===editando?{...p,...form}:p);
    savePuestos(lista);setPuestos(lista);setEditando(null);setNuevo(false);onPuestosChange();
  }
  function toggleActivo(id){const lista=puestos.map(p=>p.id===id?{...p,activo:!p.activo}:p);savePuestos(lista);setPuestos(lista);onPuestosChange();}
  function eliminar(id){if(!confirm("¿Eliminar?"))return;const lista=puestos.filter(p=>p.id!==id);savePuestos(lista);setPuestos(lista);onPuestosChange();}

  return e("div",{style:{maxWidth:1000,margin:"0 auto",padding:24}},
    e("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}},
      e("div",null,e("h2",{style:{fontSize:20,fontWeight:700}},"Gestión de Vacantes"),e("p",{style:{fontSize:13,color:"#888",marginTop:2}},puestos.filter(p=>p.activo).length+" activas · "+puestos.filter(p=>!p.activo).length+" inactivas")),
      e("button",{onClick:()=>{setForm({nombre:"",area:"Producción",requisitos:""});setNuevo(true);setEditando(null)},className:"bpri"},"+ Nueva vacante")
    ),
    (editando||nuevo)&&e("div",{style:{position:"fixed",inset:0,background:"rgba(0,0,0,.45)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:999}},
      e("div",{className:"card",style:{width:520,padding:"28px 32px",boxShadow:"0 20px 60px rgba(0,0,0,.2)"}},
        e("h3",{style:{fontSize:18,fontWeight:700,marginBottom:20}},nuevo?"Nueva vacante":"Editar vacante"),
        e("div",{style:{marginBottom:14}},e("label",{style:{fontSize:12,fontWeight:700,color:"#888",textTransform:"uppercase",display:"block",marginBottom:6}},"Nombre del puesto"),e("input",{value:form.nombre||"",onChange:ev=>setForm(f=>({...f,nombre:ev.target.value})),style:{width:"100%",padding:"10px 14px",border:"1.5px solid #e5e7eb",borderRadius:10,fontSize:14,outline:"none"}})),
        e("div",{style:{marginBottom:14}},e("label",{style:{fontSize:12,fontWeight:700,color:"#888",textTransform:"uppercase",display:"block",marginBottom:6}},"Área"),e("select",{value:form.area||"Producción",onChange:ev=>setForm(f=>({...f,area:ev.target.value})),style:{width:"100%",padding:"10px 14px",border:"1.5px solid #e5e7eb",borderRadius:10,fontSize:14,outline:"none",background:"#fff"}},...AREAS.map(a=>e("option",{key:a},a)))),
        e("div",{style:{marginBottom:20}},e("label",{style:{fontSize:12,fontWeight:700,color:"#888",textTransform:"uppercase",display:"block",marginBottom:6}},"Requisitos"),e("textarea",{value:form.requisitos||"",onChange:ev=>setForm(f=>({...f,requisitos:ev.target.value})),rows:3,style:{width:"100%",padding:"10px 14px",border:"1.5px solid #e5e7eb",borderRadius:10,fontSize:14,outline:"none",resize:"vertical"}})),
        e("div",{style:{display:"flex",gap:10}},
          e("button",{onClick:guardar,className:"bpri",style:{flex:1},disabled:!form.nombre||!form.requisitos},"Guardar"),
          e("button",{onClick:()=>{setEditando(null);setNuevo(false)},className:"bghost",style:{flex:1}},"Cancelar")
        )
      )
    ),
    e("div",{style:{display:"flex",flexDirection:"column",gap:12}},
      ...puestos.map(p=>{
        const [bg,fg]=AREA_COLORS[p.area]||["#f3f4f6","#555"];
        return e("div",{key:p.id,className:"card",style:{padding:"18px 22px",opacity:p.activo?1:.55}},
          e("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",gap:12}},
            e("div",{style:{flex:1}},
              e("div",{style:{display:"flex",alignItems:"center",gap:10,marginBottom:6}},e("span",{className:"tag",style:{background:bg,color:fg}},p.area),e("span",{style:{fontSize:12,fontWeight:600,color:p.activo?"#22c55e":"#aaa"}},p.activo?"● Activa":"○ Inactiva")),
              e("h3",{style:{fontSize:16,fontWeight:700,marginBottom:4}},p.nombre),
              e("p",{style:{fontSize:12,color:"#777",lineHeight:1.5}},p.requisitos)
            ),
            e("div",{style:{display:"flex",gap:8,flexShrink:0}},
              e("button",{onClick:()=>{setForm({nombre:p.nombre,area:p.area,requisitos:p.requisitos});setEditando(p.id);setNuevo(false)},style:{padding:"8px 14px",borderRadius:8,fontSize:12,fontWeight:600,border:"1.5px solid "+IND,background:"transparent",color:IND,cursor:"pointer"}},"✏️ Editar"),
              e("button",{onClick:()=>toggleActivo(p.id),style:{padding:"8px 12px",borderRadius:8,fontSize:12,fontWeight:600,border:"1.5px solid #e5e7eb",background:p.activo?"#fff7ed":"#f0fff4",color:p.activo?"#f59e0b":"#22c55e",cursor:"pointer"}},p.activo?"Desactivar":"Activar"),
              e("button",{onClick:()=>eliminar(p.id),style:{padding:"8px 12px",borderRadius:8,fontSize:12,border:"1.5px solid #fee2e2",background:"transparent",color:"#ef4444",cursor:"pointer"}},"🗑")
            )
          )
        );
      })
    )
  );
}

// ── PANEL VIEW ────────────────────────────────────────────────────
function PanelView({onBack,onPuestosChange}){
  const [tab,setTab]=useState("candidatos");
  return e("div",{style:{minHeight:"100vh",background:"#f4f6fb"}},
    e("div",{style:{background:IND,color:"#fff",padding:"0 24px",height:64,display:"flex",alignItems:"center",justifyContent:"space-between"}},
      e("div",{style:{display:"flex",alignItems:"center",gap:12}},
        e("button",{onClick:onBack,style:{background:"none",border:"none",color:"#fff",fontSize:18,opacity:.7,cursor:"pointer"}},"←"),
        e("span",{style:{fontSize:20,fontWeight:700}},"Panel de Reclutamiento")
      ),
      e("div",{style:{display:"flex",gap:8}},
        e("button",{onClick:()=>setTab("candidatos"),className:"tab-btn",style:{background:tab==="candidatos"?CEL:"rgba(255,255,255,.15)",color:"#fff"}},"👥 Candidatos"),
        e("button",{onClick:()=>setTab("vacantes"),className:"tab-btn",style:{background:tab==="vacantes"?CEL:"rgba(255,255,255,.15)",color:"#fff"}},"📋 Vacantes")
      )
    ),
    tab==="candidatos"&&e(CandidatosTab,null),
    tab==="vacantes"&&e(VacantesTab,{onPuestosChange})
  );
}

// ── APP ───────────────────────────────────────────────────────────
function App(){
  const [vista,setVista]=useState("home");
  const [puesto,setPuesto]=useState(null);
  const [loginPass,setLoginPass]=useState("");
  const [loginError,setLoginError]=useState("");
  const [puestos,setPuestosState]=useState(()=>getPuestos().filter(p=>p.activo));
  function recargar(){setPuestosState(getPuestos().filter(p=>p.activo))}
  return e("div",{style:{fontFamily:"'Segoe UI',sans-serif",minHeight:"100vh",background:"#f4f6fb"}},
    vista==="home"&&e(HomeView,{puestos,onCandidato:p=>{setPuesto(p);setVista("chat")},onLogin:()=>{setLoginError("");setVista("login")}}),
    vista==="login"&&e(LoginView,{pass:loginPass,setPass:setLoginPass,onLogin:()=>{if(loginPass==="HMtalento2024"){setLoginError("");setVista("panel")}else setLoginError("Contraseña incorrecta.")},error:loginError,onBack:()=>setVista("home")}),
    vista==="chat"&&e(ChatView,{puesto,onBack:()=>setVista("home")}),
    vista==="panel"&&e(PanelView,{onBack:()=>setVista("home"),onPuestosChange:recargar})
  );
}

window.addEventListener("load",()=>{
  document.getElementById("loading-screen").style.display="none";
  ReactDOM.createRoot(document.getElementById("root")).render(e(App,null));
});
</script>
</body>
